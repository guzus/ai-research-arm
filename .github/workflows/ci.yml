name: CI

on:
  push:
    branches: [main]
    paths:
      - '.claude/settings.json'
      - '.dockerignore'
      - 'Dockerfile'
      - 'Caddyfile'
      - 'railway.json'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.opencode/tools/**'
      - 'dashboard/**'
      - 'data/sources/ai_blogs.json'
      - 'data/sources/twitter_accounts.json'
      - 'prompts/**'
      - 'scripts/**'
      - 'research/models/tickets/**'
      - 'research/wiki/**'
      - 'research/wiki-translations/**'
      - 'research/generative/**'
      - 'research/front-page/*.ara.md'
      - 'research/claims/index.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ARA_CATALOG.json'
      - 'COMPONENTS.md'
      - 'docs/backend-matrix.md'
      - 'docs/generative-research-backends.md'
      - 'docs/toolchain-pins.md'
      - 'data/agent-backends.json'
      - 'data/artifact-slos.json'
      - 'data/toolchain-pins.json'
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
  pull_request:
    paths:
      - '.claude/settings.json'
      - '.dockerignore'
      - 'Dockerfile'
      - 'Caddyfile'
      - 'railway.json'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.opencode/tools/**'
      - 'dashboard/**'
      - 'data/sources/ai_blogs.json'
      - 'data/sources/twitter_accounts.json'
      - 'prompts/**'
      - 'scripts/**'
      - 'research/models/tickets/**'
      - 'research/wiki/**'
      - 'research/wiki-translations/**'
      - 'research/generative/**'
      - 'research/front-page/*.ara.md'
      - 'research/claims/index.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'ARA_CATALOG.json'
      - 'COMPONENTS.md'
      - 'docs/backend-matrix.md'
      - 'docs/generative-research-backends.md'
      - 'docs/toolchain-pins.md'
      - 'data/agent-backends.json'
      - 'data/artifact-slos.json'
      - 'data/toolchain-pins.json'
      - 'README.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: false
          pyflakes: false

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      # Provision git-lfs BEFORE checkout — `actions/checkout@v4` with
      # `lfs: true` shells out to `git lfs` during the checkout phase, so
      # if the runner image doesn't already have it the checkout fails
      # before any later install step gets to run. apt-get install needs
      # no repo content, so it's safe to run pre-checkout. Job-level
      # `defaults.run.working-directory: dashboard` doesn't exist yet (no
      # checkout), so override with `working-directory: .`.
      - name: Ensure git-lfs is installed
        working-directory: .
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            echo "git-lfs not found on runner — installing..."
            sudo apt-get update -qq && sudo apt-get install -y -qq git-lfs
          fi
          git lfs version

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # lfs: false because the LFS bandwidth budget is exhausted (audio
          # moved to S3 in May 2026 but historical LFS objects still consume
          # bandwidth on every hydration). prebuild.mjs has a
          # SKIP_LFS_POINTERS=1 escape hatch that warns + skips pointers
          # instead of failing — set on the Build step below. Type/build
          # checks don't need image content; the Vercel deploy is a separate
          # path with its own LFS toggle.
          lfs: false

      # Vite 8 requires Node.js >= 20.19. The self-hosted runner ships Node 18,
      # and `bun run build` shells out to `vite build` which uses the system
      # node shebang. Provision Node 22 explicitly so Vite has the runtime it
      # needs. Keep ahead of Vite's minimum to leave headroom.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Build
        env:
          SKIP_LFS_POINTERS: '1'
        run: bun run build

  production-image:
    # Pull requests contain untrusted code. Keep the full Docker build/run on a
    # disposable GitHub-hosted runner, never the persistent production runner.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false
      - name: Build and smoke the Railway Docker/Caddy contract
        run: bash scripts/smoke_production_container.sh

  python-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Test Python scripts
        run: uv run python -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate model-release tickets
        run: uv run python scripts/check_model_tickets.py

      - name: Validate wiki pages
        run: uv run python scripts/check_wiki.py

      - name: Validate Korean wiki mirrors
        run: uv run python scripts/check_wiki_translation.py

      # research/wiki/index.json is a generated, committed artifact (the
      # dashboard reads it; prebuild only copies it). This gate fails if it
      # has drifted from the pages — i.e. a page was edited without rerunning
      # build_wiki_index.py. The ingest workflow regenerates it every run.
      - name: Check wiki index is in sync
        run: uv run python scripts/build_wiki_index.py --check

      # research/claims/index.json is the cross-article claim store — a
      # generated, committed artifact derived from every
      # research/generative/*.claims.json ledger (docs/claim-store.md). This
      # gate fails when a new article shipped its ledger without the index
      # being rebuilt, which would silently hide those claims from reuse and
      # from the back-catalogue disagreement check.
      - name: Check claim index is in sync
        run: uv run python scripts/build_claim_index.py --check

      # data/agent-backends.json is the routing SSOT. This gate cross-checks
      # it against the workflows (every agent-run call site routes via lane:
      # with all provider secrets; pi/opencode/native mirrors match the file) and
      # fails when docs/backend-matrix.md wasn't regenerated after a routing
      # change (build_backend_matrix.py).
      - name: Check backend routing SSOT and matrix
        run: uv run python scripts/build_backend_matrix.py --check

      - name: Check audited toolchain pins and generated inventory
        run: uv run python scripts/check_toolchain_pins.py --check

  hooker-telemetry:
    needs: [actionlint, dashboard, production-image, python-scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Derive CI status
        id: ci-status
        env:
          ACTIONLINT: ${{ needs.actionlint.result }}
          DASHBOARD: ${{ needs.dashboard.result }}
          PRODUCTION_IMAGE: ${{ needs.production-image.result }}
          PYTHON_SCRIPTS: ${{ needs.python-scripts.result }}
        run: |
          if [ "$ACTIONLINT" = "success" ] && [ "$DASHBOARD" = "success" ] && [ "$PRODUCTION_IMAGE" = "success" ] && [ "$PYTHON_SCRIPTS" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "summary<<EOF"
            echo "actionlint: $ACTIONLINT"
            echo "dashboard: $DASHBOARD"
            echo "production-image: $PRODUCTION_IMAGE"
            echo "python-scripts: $PYTHON_SCRIPTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Hooker workflow telemetry
        if: steps.ci-status.outputs.status != 'success'
        uses: ./.github/actions/hooker-telemetry
        with:
          status: ${{ steps.ci-status.outputs.status }}
          text: ${{ steps.ci-status.outputs.summary }}
          tags: ci
        env:
          HOOKER_URL: ${{ secrets.HOOKER_URL }}
          HOOKER_TOKEN: ${{ secrets.HOOKER_TOKEN }}
