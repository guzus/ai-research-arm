name: Daily Earnings Signal

on:
  schedule:
    # Every 2 hours on weekdays (01:35, 03:35, ... 23:35 UTC) for Aradio's
    # realtime earnings coverage (docs/aradio.md, "What realtime means
    # here"). Observed acceptance times for the tracked issuers span
    # 06:00-22:00 UTC on business days (VRT 06:01Z, TSM 11:45Z,
    # MSFT/ARM 16:02-16:05Z, META 20:03Z, NVDA 20:21Z), and the 8-K/EX-99
    # release is accepted 27-85 min BEFORE the call, so a filing now reaches
    # research/earnings/ within ~2 h instead of at the end of the day. The
    # 23:35 slot still runs BEFORE the 00:00 UTC digest, so the same-night
    # synthesis is unchanged (same rationale as daily-youtube.yml). Issuers
    # do not file earnings at the weekend, hence 1-5.
    # The extra runs cost nothing downstream: the script is idempotent per
    # event (an unchanged event and the index re-render byte-identical, with
    # no timestamp), so a run that finds nothing new commits nothing. ~95% of
    # runs legitimately find nothing, and the 5-day lookback lets a missed
    # run self-heal on the next one.
    - cron: '35 1-23/2 * * 1-5'
  workflow_dispatch:

concurrency:
  group: daily-earnings
  cancel-in-progress: true

jobs:
  earnings:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get current date
        id: date
        run: |
          # The runner's timezone is KST; every consumer reads these as UTC.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          print(f"date={now.date().isoformat()}")
          print(f"timestamp={now.strftime('%Y-%m-%d %H:%M UTC')}")
          PY

      - name: Fetch SEC EDGAR earnings signal
        env:
          # SEC fair access requires a declared contact ADDRESS in the
          # User-Agent (a URL is answered with HTTP 403). Public by design, so
          # it is a repository variable, not a secret.
          SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL || 'birdyopensource@gmail.com' }}
        run: |
          set -euo pipefail
          # No continue-on-error: exit 3 (every tracked issuer failed) must
          # turn the run red during earnings week instead of passing quietly.
          python3 scripts/fetch_earnings_signal.py \
            --date "${{ steps.date.outputs.date }}" \
            --registry data/sources/earnings_issuers.json \
            --out-dir research/earnings \
            --lookback-days 5 \
            --contact "$SEC_CONTACT_EMAIL"

      - name: Commit earnings signal output
        run: |
          set -euo pipefail
          # Filenames are per EVENT (<date>-<TICKER>-<FYxxQx>.md), not per day,
          # so the whole directory is staged. Re-rendering an unchanged event
          # is byte-identical, which is why a quiet run is a clean no-op.
          git add research/earnings
          git commit -m "Earnings signal ${{ steps.date.outputs.timestamp }}" || echo "No changes"

      - name: Push changes
        uses: ./.github/actions/safe-push
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Hooker workflow telemetry
        if: always()
        uses: ./.github/actions/hooker-telemetry
        with:
          status: ${{ job.status }}
        env:
          HOOKER_URL: ${{ secrets.HOOKER_URL }}
          HOOKER_TOKEN: ${{ secrets.HOOKER_TOKEN }}
