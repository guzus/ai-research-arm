name: Daily Earnings Signal

on:
  schedule:
    # Weekday evenings only, and deliberately BEFORE the 00:00 UTC digest -
    # same rationale as daily-youtube.yml. Observed acceptance times for the
    # tracked issuers span 06:00-22:00 UTC on business days (VRT 06:01Z,
    # TSM 11:45Z, MSFT/ARM 16:02-16:05Z, META 20:03Z, NVDA 20:21Z), so a
    # 23:35 UTC run catches the same trading day and feeds the same-night
    # synthesis. Issuers do not file earnings at the weekend, hence 1-5.
    # ~95% of runs legitimately find nothing; the script writes nothing and
    # exits 0 on those days, and the 5-day lookback lets a missed run
    # self-heal on the next one.
    - cron: '35 23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: daily-earnings
  cancel-in-progress: true

jobs:
  earnings:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get current date
        id: date
        run: |
          # The runner's timezone is KST; every consumer reads these as UTC.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          now = dt.datetime.now(dt.timezone.utc)
          print(f"date={now.date().isoformat()}")
          print(f"timestamp={now.strftime('%Y-%m-%d %H:%M UTC')}")
          PY

      - name: Fetch SEC EDGAR earnings signal
        env:
          # SEC fair access requires a declared contact ADDRESS in the
          # User-Agent (a URL is answered with HTTP 403). Public by design, so
          # it is a repository variable, not a secret.
          SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL || 'birdyopensource@gmail.com' }}
        run: |
          set -euo pipefail
          # No continue-on-error: exit 3 (every tracked issuer failed) must
          # turn the run red during earnings week instead of passing quietly.
          python3 scripts/fetch_earnings_signal.py \
            --date "${{ steps.date.outputs.date }}" \
            --registry data/sources/earnings_issuers.json \
            --out-dir research/earnings \
            --lookback-days 5 \
            --contact "$SEC_CONTACT_EMAIL"

      - name: Commit earnings signal output
        run: |
          set -euo pipefail
          # Filenames are per EVENT (<date>-<TICKER>-<FYxxQx>.md), not per day,
          # so the whole directory is staged. Re-rendering an unchanged event
          # is byte-identical, which is why a quiet run is a clean no-op.
          git add research/earnings
          git commit -m "Earnings signal ${{ steps.date.outputs.timestamp }}" || echo "No changes"

      - name: Push changes
        uses: ./.github/actions/safe-push
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Hooker workflow telemetry
        if: always()
        uses: ./.github/actions/hooker-telemetry
        with:
          status: ${{ job.status }}
        env:
          HOOKER_URL: ${{ secrets.HOOKER_URL }}
          HOOKER_TOKEN: ${{ secrets.HOOKER_TOKEN }}
