name: Aradio

# Aradio — ARA's rolling two-host AI news station (contract: docs/aradio.md).
#
#   1. build_aradio_inbox.py   trusted, deterministic inbox + GATE. Most runs
#                              stop here: no model, no TTS, nothing committed.
#   2. agent-dispatch          isolated editor; returns ONE uncommitted file,
#                              .tmp/aradio/edit.json (ops + optional script).
#   3. check_aradio.py         trusted validator: hard errors publish nothing and
#                              leave the cursor, so the next run retries.
#   4. aradio_tts.py           Gemini 3.8 Flash TTS (only when on air).
#   5. aws s3 cp               immutable audio/aradio/<id>.mp3.
#   6. write_aradio_bulletin.py the ONLY committer for research/aradio/.
#   7. safe-push, then the job fails if the editor or the audio failed.
#
# Audio failure is LOUD: the text still publishes (audio: null + audio_error),
# then the job fails. The daily broadcast's continue-on-error TTS step, which
# kept the digest green through nine days of Gemini errors, is the
# anti-pattern this lane avoids.

# Says which lane woke the station. A forced dispatch is named so that the
# history step can find it if the concurrency queue cancels it before it runs
# (aradio_run_alert.FORCED_TITLE). Other runs keep the workflow's name.
run-name: ${{ github.event_name == 'workflow_run' && format('Aradio after {0}', github.event.workflow_run.name) || inputs.force && 'Aradio (forced)' || github.workflow }}

on:
  # Aradio airs when the picture changes, so each lane that feeds the inbox
  # wakes it when that lane's run completes: podcasts (episodes and YouTube
  # channels via tuber), earnings filings, Twitter stories and model tickets
  # (build_aradio_inbox.py's four collectors). The names must equal those
  # workflows' `name:` exactly; a test pins this list to the producers of the
  # lanes the gate reads. The gate keeps the extra runs model-free.
  workflow_run:
    workflows:
      - "Podcast Signal"
      - "Daily Earnings Signal"
      - "Twitter AI News (hourly matrix)"
      - "Hyperscaler Model Release Timeline (Every 24 Hours)"
    types: [completed]
    branches: [main]
  schedule:
    # Backstop, hourly at :50: routine material that waited for the 2 h
    # cadence airs within the hour after it, even when no lane finishes.
    # Do not rely on it alone. GitHub fires schedules late or not at all
    # under load, and on 2026-10-31 this one fired none of its slots from
    # the workflow's 08:21 re-enable until 14:47 UTC, even after #6316
    # pushed this file at 11:17 (docs/aradio.md "Triggers").
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run the editor even when the gate would stop
        required: false
        default: false
        type: boolean

# Serialize runs: the cursor and the board are single-writer state. GitHub
# keeps one pending run per group and cancels the older one, so a burst of
# triggers collapses to one running and one pending run; the pending one
# reads the branch tip when it starts. A forced dispatch cancelled that way
# is honoured by a later run (the history step below). A run that can never
# write takes a group of its own, so it never displaces a real pending run:
# a lane run from another repository (the job's `if` skips it) or a dispatch
# from another branch (the ref guard refuses it, and the history step lists
# only main's runs, so a forced run it displaced would look cancelled by
# hand). The repository condition must stay identical to the job's `if`
# (test-pinned).
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main'
    && (github.event_name != 'workflow_run'
    || github.event.workflow_run.head_repository.full_name == github.repository)
    && 'aradio' || format('aradio-isolated-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  aradio:
    # Any conclusion wakes the station: a lane can publish and then fail a
    # later step (Twitter's headline alerts run after its push), and a stop is
    # model-free, so the gate decides. A lane run from another repository's
    # fork must never wake a job holding secrets.
    if: >-
      ${{ github.event_name != 'workflow_run'
      || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    permissions:
      # actions: read lets the run's alert step list earlier runs (recovery).
      actions: read
      contents: write
      pull-requests: write

    steps:
      # The self-hosted workspace persists between jobs. Move only the exact
      # canonical checkout aside before checkout runs Git against it.
      - name: Quarantine stale self-hosted workspace
        id: quarantine_workspace
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' 'GIT_CONFIG_NOSYSTEM=1'
            printf '%s\n' 'GIT_CONFIG_GLOBAL=/dev/null'
            printf '%s\n' 'GIT_NO_REPLACE_OBJECTS=1'
          } >> "$GITHUB_ENV"
          repo_name="${GITHUB_REPOSITORY##*/}"
          runner_root=$(realpath -- "$RUNNER_WORKSPACE")
          workspace_parent=$(realpath -- "$(dirname -- "$GITHUB_WORKSPACE")")
          workspace_name=$(basename -- "$GITHUB_WORKSPACE")
          if [[ ! "$repo_name" =~ ^[A-Za-z0-9_.-]+$ ]] \
            || [ "$repo_name" = "." ] || [ "$repo_name" = ".." ] \
            || [ "$workspace_parent" != "$runner_root" ] \
            || [ "$workspace_name" != "$repo_name" ]; then
            echo "::error::Refusing to quarantine an unexpected workspace: $GITHUB_WORKSPACE"
            exit 1
          fi
          workspace_entry="$runner_root/$repo_name"
          if [ ! -e "$workspace_entry" ] && [ ! -L "$workspace_entry" ]; then
            echo "::error::Expected runner workspace entry is missing: $workspace_entry"
            exit 1
          fi
          quarantine=$(mktemp -d "$runner_root/.opencode-precheckout.XXXXXX")
          quarantine_name=$(basename -- "$quarantine")
          case "$quarantine_name" in
            .opencode-precheckout.??????) ;;
            *) echo "::error::Unexpected quarantine path: $quarantine"; exit 1 ;;
          esac
          rmdir -- "$quarantine"
          cd "$runner_root"
          mv -- "$workspace_entry" "$quarantine"
          mkdir -- "$workspace_entry"
          rm -rf -- "$quarantine"

      # Publishing is main-only. From any other ref the run would spend the
      # editor and TTS and upload public audio before safe-push refused to
      # publish. Stop before checkout or any spend; this sits after the
      # quarantine so the always() cleanup and telemetry steps run against an
      # empty workspace, never a stale checkout. The ref goes through env,
      # never ${{ }} inside the script.
      - name: Refuse refs other than main
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::Aradio publishes only from refs/heads/main, and this run is on ${RUN_REF}. Dispatch it from main."
            exit 1
          fi

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        with:
          # The board and cursor are read-modify-write state. A forced dispatch
          # queued behind a running job, or an auto-rerun, must read the branch
          # tip at execution time, not the trigger-time SHA (stale state would
          # re-offer consumed items and conflict at push).
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Python dependencies
        id: deps
        run: uv sync --frozen

      # One UTC read for the whole run: the bulletin id, the S3 key, aired_at
      # and the commit message all derive from this minute-aligned stamp.
      - name: Stamp the run (UTC)
        id: stamp
        run: |
          set -euo pipefail
          stamp=$(date -u +'%Y-%m-%dT%H:%M:00Z')
          scratch="$RUNNER_TEMP/aradio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$scratch"
          mkdir -p -- "$scratch"
          {
            echo "stamp=$stamp"
            echo "id=${stamp:0:10}-${stamp:11:2}${stamp:14:2}"
            echo "scratch=$scratch"
          } >> "$GITHUB_OUTPUT"

      # Failed runs commit nothing, so the run history is the only record of
      # an outage. The gate backs off from the newest failed editor run since
      # the last bulletin (doubling from 30 min to 4 h, 2 h while priority
      # material waits) instead of retrying the editor on every trigger. A
      # run that hung past timeout-minutes counts (GitHub reports it as
      # cancelled); a setup or gate failure spent no editor time and does
      # not. A failed lookup leaves no record, which means no backoff, never
      # no attempts. The same listing finds a forced dispatch the concurrency
      # queue cancelled before it ran (force_pending): this run honours it
      # unless an editor has run since it was queued. Normally a few seconds;
      # a timeout is a failed lookup like any other (no record, no force) and
      # never holds up the gate.
      - name: Read failed runs since the last bulletin
        id: history
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          SCRATCH: ${{ steps.stamp.outputs.scratch }}
        run: |
          python3 scripts/aradio_run_alert.py --history \
            --attempts-out "$SCRATCH/attempts.json" --github-output "$GITHUB_OUTPUT"

      # Deterministic gate + inbox. The agent gets .agent-input/aradio/; the
      # validator and writer read only the trusted copy under $RUNNER_TEMP,
      # never .tmp/ (the import path) or .agent-input/.
      - name: Build inbox and apply the gate
        id: inbox
        env:
          NOW: ${{ steps.stamp.outputs.stamp }}
          SCRATCH: ${{ steps.stamp.outputs.scratch }}
          FORCE: ${{ inputs.force || steps.history.outputs.force_pending == 'true' }}
          TUBER_API_BASE: ${{ vars.TUBER_API_BASE || 'https://tuber-api.guzus.xyz' }}
        run: |
          set -euo pipefail
          uv run python scripts/build_aradio_inbox.py \
            --now "$NOW" \
            --out-dir .agent-input/aradio \
            --trusted-dir "$SCRATCH/trusted" \
            --force "$FORCE" \
            --tuber-api-base "$TUBER_API_BASE" \
            --attempts "$SCRATCH/attempts.json" \
            --expired-out "$SCRATCH/expired.json" \
            --github-output "$GITHUB_OUTPUT"

      # A priority item (earnings filing or call, long-form P0 episode) that
      # leaves its window unaired was lost to an outage: every editor run in
      # its window failed, or none ran. The gate writes the list on every
      # run, stop or go. Each item is posted once, keyed on the item, so the
      # day's later runs are Hooker idempotency hits, and it is annotated on
      # that first post only (on every run while Hooker cannot take it, since
      # then nobody else is told). Titles are third-party text: jq
      # HTML-escapes them into a raw_text body, so Hooker neither escapes them
      # twice nor promotes a title's own tags to markup, and the log line
      # comes pre-escaped for workflow commands. On a go this runs just
      # before the editor, so each POST is time-boxed and the step is too.
      # No --retry: Hooker records the key before it delivers, so a retried
      # POST would come back as an idempotency hit that delivered nothing.
      - name: Report priority items that expired unaired
        if: always() && steps.stamp.outputs.scratch != ''
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          HOOKER_URL: ${{ secrets.HOOKER_URL }}
          HOOKER_TOKEN: ${{ secrets.HOOKER_TOKEN }}
          REPORT: ${{ steps.stamp.outputs.scratch }}/expired.json
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT" ] || [ "$(jq length "$REPORT")" = "0" ]; then
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="Aradio never aired a priority item"
          jq -c '.[]' "$REPORT" | while IFS= read -r item; do
            log=$(jq -r '.log' <<<"$item")
            if [ -z "${HOOKER_URL:-}" ] || [ -z "${HOOKER_TOKEN:-}" ]; then
              echo "::warning title=${title}::${log} (Hooker is not configured)"
              continue
            fi
            body=$(jq -n --argjson item "$item" --arg title "$title" --arg run "$run_url" '{
              title: $title,
              text: (["❓ <b>\($title)</b>", ("\($item.kind): \($item.source)" | @html),
                      ($item.title | @html),
                      "At \($item.at); its \($item.window_days)-day window closed without a published editor run.",
                      ("Key: \($item.key)" | @html), ("Run: \($run)" | @html)] | join("\n")),
              raw_text: true,
              priority: 4,
              tags: ["ara", "aradio", "expired", $item.kind],
              parse_mode: "HTML",
              payload: {kind: "aradio-expired", item: ($item | del(.log)), run_url: $run},
              reply_markup: {inline_keyboard: [[{text: "GitHub run", url: $run}]]}
            }')
            key=$(jq -r '.idempotency_key' <<<"$item")
            if response=$(curl -sS --fail-with-body --max-time 30 -X POST "${HOOKER_URL%/}/publish/ara-telemetry" \
                -H "Authorization: Bearer ${HOOKER_TOKEN}" \
                -H "Content-Type: application/json" \
                -H "Idempotency-Key: ${key}" \
                --data-binary "$body"); then
              if [ "$(jq -r '.idempotency_hit // false' <<<"$response" 2>/dev/null || echo false)" = "true" ]; then
                echo "Already reported: ${log}"
              else
                echo "::warning title=${title}::${log}"
              fi
            else
              echo "::warning title=${title}::${log} (Hooker publish failed)"
            fi
          done

      # The prompt is a trusted repo file; a random heredoc delimiter keeps
      # any line of it from terminating the step output early. The adapter
      # imports the return artifact only into an existing canonical parent.
      - name: Load editor prompt
        id: prompt
        if: steps.inbox.outputs.go == 'true'
        run: |
          set -euo pipefail
          delimiter="ARADIO_PROMPT_$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          if grep -qF -- "$delimiter" prompts/aradio-editor.md; then
            echo "::error::Prompt collides with its output delimiter."
            exit 1
          fi
          {
            printf 'text<<%s\n' "$delimiter"
            cat prompts/aradio-editor.md
            printf '\n%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"
          mkdir -p .tmp/aradio
          rm -f -- .tmp/aradio/edit.json

      - name: Capture Aradio output base
        id: base
        if: steps.inbox.outputs.go == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # continue-on-error so the explicit failure step below can say what
      # happened; nothing downstream runs unless this step succeeded. Its
      # name is how the history step tells an editor run from a gate stop
      # (aradio_run_alert.EDITOR_STEP, test-pinned).
      - name: Edit the situation board with the SSOT-routed editor
        id: editor
        if: steps.inbox.outputs.go == 'true'
        continue-on-error: true
        uses: ./.github/actions/agent-dispatch
        with:
          mode: editorial
          lane: aradio
          return-artifacts: .tmp/aradio/edit.json
          # Read the staged inbox, write one file: no shell, web, MCP, or
          # writes to the repo's code and data. One policy per adapter; the
          # SSOT route decides which one runs.
          cursor-config: .github/cursor/aradio.json
          opencode-config: .github/opencode/aradio.json
          claude-config: .github/claude/aradio.json
          timeout-minutes: '12'
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fireworks-api-key: ${{ secrets.FIREWORKS_API_KEY }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
          cursor-api-key: ${{ secrets.CURSOR_API_KEY }}
          prompt-text: ${{ steps.prompt.outputs.text }}

      # Hard errors fail here and publish nothing; soft errors are repaired.
      - name: Validate the editor's ops
        id: validate
        if: steps.inbox.outputs.go == 'true' && steps.editor.outcome == 'success'
        env:
          SCRATCH: ${{ steps.stamp.outputs.scratch }}
        run: |
          set -euo pipefail
          uv run python scripts/check_aradio.py \
            --edit .tmp/aradio/edit.json \
            --inbox "$SCRATCH/trusted/inbox.json" \
            --state research/aradio/state.json \
            --out "$SCRATCH/edit.normalized.json" \
            --github-output "$GITHUB_OUTPUT"

      # The WAV stays under $RUNNER_TEMP (`.wav` is an LFS extension here).
      - name: Voice the bulletin with Gemini TTS
        id: tts
        if: steps.validate.outcome == 'success' && steps.validate.outputs.on_air == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRATCH: ${{ steps.stamp.outputs.scratch }}
        run: |
          set -euo pipefail
          uv run python scripts/aradio_tts.py \
            --edit "$SCRATCH/edit.normalized.json" \
            --out "$SCRATCH/bulletin.mp3" \
            --work-dir "$SCRATCH" \
            --result "$SCRATCH/tts.json"

      # Keys are immutable (s3.guzus.xyz caches 200s behind Cloudflare); the
      # "latest" pointer is research/aradio/index.json.
      - name: Upload bulletin audio to S3
        id: upload
        if: steps.tts.outcome == 'success'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          SCRATCH: ${{ steps.stamp.outputs.scratch }}
          BULLETIN_ID: ${{ steps.stamp.outputs.id }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY S3_ENDPOINT_URL S3_BUCKET; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured; bulletin audio cannot be published."
              exit 1
            fi
          done
          mp3="$SCRATCH/bulletin.mp3"
          key="audio/aradio/${BULLETIN_ID}.mp3"
          test -s "$mp3"
          aws s3 cp "$mp3" "s3://${S3_BUCKET}/${key}" \
            --endpoint-url "$S3_ENDPOINT_URL" \
            --content-type audio/mpeg \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Configure trusted writer identity
        if: steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Runs whether or not the audio worked: the text always publishes.
      - name: Publish board and bulletin
        id: writer
        if: steps.validate.outcome == 'success'
        env:
          SCRATCH: ${{ steps.stamp.outputs.scratch }}
          NOW: ${{ steps.stamp.outputs.stamp }}
          TTS_OUTCOME: ${{ steps.tts.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          AUDIO_KEY: ${{ steps.upload.outputs.key }}
          BACKEND: ${{ steps.editor.outputs.effective-backend }}
          MODEL: ${{ steps.editor.outputs.model-id }}
        run: |
          set -euo pipefail
          audio_error=""
          if [ "$TTS_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" != "success" ]; then
            audio_error="audio upload to S3 failed"
          fi
          uv run python scripts/write_aradio_bulletin.py \
            --edit "$SCRATCH/edit.normalized.json" \
            --inbox "$SCRATCH/trusted/inbox.json" \
            --now "$NOW" \
            --tts-result "$SCRATCH/tts.json" \
            --audio-key "$AUDIO_KEY" \
            --audio-error "$audio_error" \
            --backend "$BACKEND" \
            --model "$MODEL" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require Aradio output
        id: require_output
        if: steps.writer.outcome == 'success'
        uses: ./.github/actions/require-output
        with:
          base-sha: ${{ steps.base.outputs.sha }}
          expected-paths: |
            research/aradio/cursor.json
          label: Aradio writer

      - name: Enforce Aradio diff scope
        id: diff_scope
        if: steps.writer.outcome == 'success'
        uses: ./.github/actions/require-diff-scope
        with:
          base-sha: ${{ steps.base.outputs.sha }}
          allowed-paths: |
            research/aradio/
          label: Aradio writer

      - name: Remove untrusted staging files
        if: always()
        run: rm -rf -- .tmp .agent-input

      - name: Push changes
        id: push
        if: steps.writer.outcome == 'success'
        uses: ./.github/actions/safe-push
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          strict-publication: 'true'

      - name: Fail when the editor failed
        if: always() && steps.inbox.outputs.go == 'true' && steps.editor.outcome != 'success'
        run: |
          echo "::error::The Aradio editor failed its containment or artifact contract; nothing was published and the cursor did not advance."
          exit 1

      # After publishing: the text is live with audio: null + audio_error, and
      # the run goes red so a silent-audio outage cannot hide.
      - name: Fail when on-air audio is missing
        if: always() && steps.validate.outputs.on_air == 'true' && (steps.tts.outcome != 'success' || steps.upload.outcome != 'success')
        env:
          TTS_OUTCOME: ${{ steps.tts.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "::error::The bulletin aired without audio (TTS: ${TTS_OUTCOME:-skipped}, upload: ${UPLOAD_OUTCOME:-skipped}); its text was published with audio_error. See the TTS step log for the HTTP status and error body."
          exit 1

      - name: Remove Aradio scratch
        if: always()
        env:
          SCRATCH: ${{ steps.stamp.outputs.scratch }}
        run: |
          if [ -n "${SCRATCH:-}" ]; then
            rm -rf -- "$SCRATCH"
          fi

      # A run that fails without publishing leaves the cursor, so the next
      # run fails the same way: keyed on the failing stage, the cursor's last
      # publication and the UTC date, the outage is one Hooker alert a day,
      # and the first run that publishes again reports the recovery once
      # (scripts/aradio_run_alert.py). A run cancelled at timeout-minutes is
      # stuck on the stage it hung in. Empty outputs keep the defaults.
      - name: Shape the run's Hooker event
        id: run_alert
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SINCE: ${{ steps.inbox.outputs.since }}
          FAILED_SINCE: ${{ steps.history.outputs.failed }}
          GATE_REASON: ${{ steps.inbox.outputs.reason }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          DEPS: ${{ steps.deps.outcome }}
          INBOX: ${{ steps.inbox.outcome }}
          EDITOR: ${{ steps.editor.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          WRITER: ${{ steps.writer.outcome }}
          REQUIRE_OUTPUT: ${{ steps.require_output.outcome }}
          DIFF_SCOPE: ${{ steps.diff_scope.outcome }}
          PUSH: ${{ steps.push.outcome }}
        run: python3 scripts/aradio_run_alert.py --github-output "$GITHUB_OUTPUT"

      - name: Publish Hooker workflow telemetry
        if: always()
        continue-on-error: true
        uses: ./.github/actions/hooker-telemetry
        with:
          status: ${{ job.status }}
          title: ${{ steps.run_alert.outputs.title || 'Aradio' }}
          text: "${{ steps.run_alert.outputs.text || format('Gate: {0}', steps.inbox.outputs.reason) }}"
          priority: ${{ steps.run_alert.outputs.priority }}
          tags: ${{ steps.run_alert.outputs.tags || 'aradio' }}
          idempotency-key: ${{ steps.run_alert.outputs.idempotency_key }}
        env:
          HOOKER_URL: ${{ secrets.HOOKER_URL }}
          HOOKER_TOKEN: ${{ secrets.HOOKER_TOKEN }}
