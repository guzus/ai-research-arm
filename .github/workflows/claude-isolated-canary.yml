name: Claude Isolated Canary

# Diagnostics lane for the isolated Claude Code adapter (run-claude-container),
# which serves the claude-sonnet-5p5-isolated backend behind routes.aradio.
#
#   CLAUDE_CODE_OAUTH_TOKEN — the same OAuth token the native Claude lanes use
#   model `claude/claude-sonnet-5-5`
#
# STRICT like cursor-cli-canary.yml: this lane exists to test the isolated
# Claude path, so an outage must fail this run, never re-route it.
#
# One harness probe on the production runner tier: the containerised Claude
# Code CLI runs one headless `claude -p` turn with the production model id and
# the tool-free .github/claude/canary.json policy, so the canary cannot read
# or touch the repository. It proves the token, quota, served model, image
# build, and container plumbing end to end. It does not exercise the lane's
# Read/Write policy; the first live Aradio run does.

on:
  workflow_dispatch:

concurrency:
  group: claude-isolated-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Quarantine stale self-hosted workspace
        id: quarantine_workspace
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '%s\n' 'GIT_CONFIG_NOSYSTEM=1'
            printf '%s\n' 'GIT_CONFIG_GLOBAL=/dev/null'
            printf '%s\n' 'GIT_NO_REPLACE_OBJECTS=1'
          } >> "$GITHUB_ENV"
          repo_name="${GITHUB_REPOSITORY##*/}"
          runner_root=$(realpath -- "$RUNNER_WORKSPACE")
          workspace_parent=$(realpath -- "$(dirname -- "$GITHUB_WORKSPACE")")
          workspace_name=$(basename -- "$GITHUB_WORKSPACE")
          if [[ ! "$repo_name" =~ ^[A-Za-z0-9_.-]+$ ]] \
            || [ "$repo_name" = "." ] || [ "$repo_name" = ".." ] \
            || [ "$workspace_parent" != "$runner_root" ] \
            || [ "$workspace_name" != "$repo_name" ]; then
            echo "::error::Refusing to quarantine an unexpected workspace: $GITHUB_WORKSPACE"
            exit 1
          fi
          workspace_entry="$runner_root/$repo_name"
          if [ ! -e "$workspace_entry" ] && [ ! -L "$workspace_entry" ]; then
            echo "::error::Expected runner workspace entry is missing: $workspace_entry"
            exit 1
          fi
          quarantine=$(mktemp -d "$runner_root/.claude-precheckout.XXXXXX")
          quarantine_name=$(basename -- "$quarantine")
          case "$quarantine_name" in
            .claude-precheckout.??????) ;;
            *) echo "::error::Unexpected quarantine path: $quarantine"; exit 1 ;;
          esac
          rmdir -- "$quarantine"
          cd "$runner_root"
          mv -- "$workspace_entry" "$quarantine"
          mkdir -- "$workspace_entry"
          rm -rf -- "$quarantine"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        with:
          persist-credentials: false
          set-safe-directory: false

      - name: Check Claude OAuth token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::No Claude OAuth token configured. Mint one with: claude setup-token, then: gh secret set CLAUDE_CODE_OAUTH_TOKEN"
            exit 1
          fi

      - name: Run isolated Claude Code file-free canary
        uses: ./.github/actions/run-claude-container
        with:
          mode: canary
          prompt-text: 'Reply with exactly this token and nothing else: CLAUDE-ISOLATED-CANARY-OK'
          model: claude/claude-sonnet-5-5
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude-config: .github/claude/canary.json
          timeout-minutes: '10'
          max-turns: '2'
          output-file: ${{ runner.temp }}/claude-isolated-canary.out

      - name: Require token, served model, and a clean tool-free turn
        run: |
          set -euo pipefail
          python3 scripts/check_claude_isolated_canary.py \
            "${RUNNER_TEMP:-/tmp}/claude-isolated-canary.out" \
            --model claude-sonnet-5-5 --token CLAUDE-ISOLATED-CANARY-OK
