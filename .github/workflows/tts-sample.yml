name: TTS Sample (audio digest preview)

# Renders a listenable sample of the daily audio digest whenever a PR
# changes daily-digest.yml, so TTS model/voice changes can be judged by ear
# before merge. Runs the EXACT "Generate audio digest" step from
# daily-digest.yml (extracted at runtime, not duplicated) against the most
# recent committed spoken script, and uploads the MP3 as a run artifact.
# Nothing is committed, uploaded to S3, or sent to Telegram.

on:
  pull_request:
    paths:
      - '.github/workflows/daily-digest.yml'
      - '.github/workflows/tts-sample.yml'
  workflow_dispatch:

jobs:
  tts-sample:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Pick the newest spoken script on disk and alias it to DATE so the
      # extracted step finds it at its usual path.
      - name: Select sample script
        id: pick
        run: |
          SPOKEN=$(ls research/summaries/*-digest-spoken.txt | sort | tail -1)
          DATE=$(basename "$SPOKEN" -digest-spoken.txt)
          echo "Sample script: $SPOKEN"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      # Extract the TTS step's run script from daily-digest.yml so the sample
      # exercises exactly what the nightly job will run.
      - name: Render sample with the digest's TTS step
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATE: ${{ steps.pick.outputs.date }}
        run: |
          uv run python - <<'PY' > /tmp/tts-step.sh
          import yaml
          wf = yaml.safe_load(open(".github/workflows/daily-digest.yml"))
          steps = [s for job in wf["jobs"].values() for s in job["steps"]]
          step = next(s for s in steps if s.get("name", "").startswith("Generate audio digest"))
          print(step["run"])
          PY
          bash -e /tmp/tts-step.sh
          test -s "research/audio/${DATE}-digest.mp3" || { echo "No audio produced"; exit 1; }
          mkdir -p /tmp/tts-sample
          cp "research/audio/${DATE}-digest.mp3" "/tmp/tts-sample/tts-sample-${DATE}.mp3"

      - name: Upload sample MP3
        uses: actions/upload-artifact@v4
        with:
          name: tts-sample
          path: /tmp/tts-sample/*.mp3
