name: ARA agent run
description: Run an agent through native Claude, Fireworks, Z.ai, or an explicitly compatible isolated adapter fallback and optionally require committed output.

inputs:
  lane:
    description: Lane key in data/agent-backends.json (the routing SSOT). The lane's backend is resolved at runtime, so editing that file re-routes the lane with no workflow change.
    required: false
    default: ""
  backend:
    description: Explicit agent-run-compatible backend override. Cross-adapter backends require a lane fallback_chain contract and are rejected here. CI bans explicit backends in committed workflows.
    required: false
    default: ""
  claude-code-oauth-token:
    description: Claude Code OAuth token. Required by claude-code-action, even for Fireworks-routed runs.
    required: true
  fireworks-api-key:
    description: Fireworks API key for Fireworks-routed backends.
    required: false
    default: ""
  zai-api-key:
    description: Z.ai Coding Plan API key for Z.ai-routed Claude Code runs.
    required: false
    default: ""
  opencode-api-key:
    description: OpenCode Go key. Passed only to a lane-explicit isolated OpenCode fallback.
    required: false
    default: ""
  opencode-mode:
    description: Isolated OpenCode contract/input mode. Use twitter only for callers that stage .twitter-input; all other agent-run lanes remain editorial.
    required: false
    default: editorial
  cursor-api-key:
    description: Cursor API key. Passed only to a lane-explicit isolated Cursor fallback.
    required: false
    default: ""
  cursor-mode:
    description: Isolated Cursor contract/input mode. Use twitter only for callers that stage .twitter-input; all other agent-run lanes remain editorial.
    required: false
    default: editorial
  fireworks-fallback:
    description: Fallback policy. claude (default) = walk the lane fallback_chain override when declared, otherwise the global fallback.chain; none = strict, requested backend only.
    required: false
    default: claude
  claude-args:
    description: Arguments passed to claude-code-action.
    required: true
  prompt:
    description: Prompt passed to claude-code-action.
    required: true
  expected-paths:
    description: Optional newline-delimited git pathspecs that must change between pre-run HEAD and post-run HEAD.
    required: false
    default: ""
  allowed-paths:
    description: Optional newline-delimited git pathspecs that are allowed to change between pre-run HEAD and post-run HEAD. Defaults to expected-paths.
    required: false
    default: ""
  label:
    description: Human-readable label for logs and output guard annotations.
    required: false
    default: agent run
  allowed-bots:
    description: Optional allowed_bots value for claude-code-action.
    required: false
    default: ""
  native-model:
    description: Override for the model served when the effective backend is native Claude (direct requests and Fireworks fallback). Empty = the global fallback.native_model from data/agent-backends.json. The claude-args `--model opus` alias resolves to this.
    required: false
    default: ""

outputs:
  pre-sha:
    description: HEAD before the agent ran.
    value: ${{ steps.pre.outputs.sha }}
  post-sha:
    description: HEAD after the agent ran.
    value: ${{ steps.post.outputs.sha }}
  backend:
    description: Normalized requested backend selector.
    value: ${{ steps.select.outputs.requested-backend }}
  effective-backend:
    description: Backend actually used after walking the SSOT fallback chain (pre-agent probe OR post-agent reselection after a Claude dead-start).
    value: ${{ steps.reselect.outputs.backend || steps.select.outputs.backend }}
  used-fallback:
    description: "true when the requested backend was unavailable (or died at agent time) and a chain candidate was selected"
    value: ${{ steps.reselect.outputs.used-fallback || steps.select.outputs.used-fallback }}
  claude-dead-start:
    description: "true when native Claude was selected but died before doing any work (is_error, <=1 turn, $0 — throttle or rejected credential) and the lane chain was re-walked post-agent"
    value: ${{ steps.claude-outcome.outputs.dead-start == 'true' }}
  model-id:
    description: Provider model id of the EFFECTIVE backend (empty on the native path — see native-model resolution).
    value: ${{ steps.reselect.outputs.model-id || steps.select.outputs.model-id }}
  native-model:
    description: Resolved native Claude model (what the `--model opus` alias serves on the native path — the native-model input, else the SSOT's global fallback.native_model).
    value: ${{ steps.select.outputs.native-model }}
  execution-file:
    description: Path to the Claude Code execution transcript JSON reported by a Claude-compatible child (intentionally empty for isolated adapters). Callers that need it after a later agent-run call in the same job must copy it immediately.
    value: ${{ steps.run-zai-fallback.outputs.execution_file || steps.run-zai-fallback-bots.outputs.execution_file || steps.run-claude.outputs.execution_file || steps.run-claude-bots.outputs.execution_file || steps.run-fireworks.outputs.execution_file || steps.run-fireworks-bots.outputs.execution_file || steps.run-zai.outputs.execution_file || steps.run-zai-bots.outputs.execution_file }}
  changed:
    description: "true when expected-paths were provided and changed"
    value: ${{ steps.guard.outputs.changed }}
  changed-files:
    description: Newline-delimited changed files under expected paths.
    value: ${{ steps.guard.outputs.changed-files }}
  diff-in-scope:
    description: "true when every committed changed file is under allowed paths"
    value: ${{ steps.scope.outputs.in-scope }}
  violating-files:
    description: Newline-delimited committed changed files outside allowed paths.
    value: ${{ steps.scope.outputs.violating-files }}

runs:
  using: composite
  steps:
    - name: Capture pre-run HEAD
      id: pre
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Routing SSOT: scripts/select_backend.py resolves the lane's backend
    # from data/agent-backends.json, probes the requested provider, and on
    # unavailability walks the explicit lane fallback_chain override when
    # present, otherwise the ordered global fallback.chain. Strict lanes /
    # fireworks-fallback=none skip both chains.
    # No input at all is a hard error — never a silent default.
    - name: Select backend (SSOT lane + ordered fallback chain)
      id: select
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        BACKEND_OVERRIDE: ${{ inputs.backend }}
        NATIVE_MODEL_OVERRIDE: ${{ inputs.native-model }}
        FALLBACK_POLICY: ${{ inputs.fireworks-fallback }}
        FIREWORKS_API_KEY: ${{ inputs.fireworks-api-key }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        CURSOR_API_KEY: ${{ inputs.cursor-api-key }}
        # The Claude OAuth preflight is AUTH-ONLY: 401/403 = unavailable
        # (non-strict → walk the chain); 429 is the steady-state answer a
        # healthy OAuth token gives this raw ping and therefore UP. A real
        # throttle is detected after the Claude step (see "Classify native
        # Claude outcome" below) and re-walks the same chain post-agent.
        # Without the token the native path is also unavailable.
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
      run: |
        set -euo pipefail
        args=(--github-output "$GITHUB_OUTPUT" --fallback-policy "${FALLBACK_POLICY:-claude}")
        if [ -n "$BACKEND_OVERRIDE" ]; then
          if [ -n "$LANE" ]; then
            echo "::notice::agent-run lane '$LANE' overridden by explicit backend '$BACKEND_OVERRIDE'"
          fi
          args+=(--backend "$BACKEND_OVERRIDE")
        elif [ -n "$LANE" ]; then
          args+=(--lane "$LANE")
        else
          echo "::error::agent-run requires a 'lane' (see data/agent-backends.json) or an explicit 'backend' input."
          exit 1
        fi
        if [ -n "$NATIVE_MODEL_OVERRIDE" ]; then
          args+=(--native-model-override "$NATIVE_MODEL_OVERRIDE")
        fi
        python3 scripts/select_backend.py "${args[@]}"

    - name: Resolve isolated editorial path contract
      id: isolated-contract
      if: steps.select.outputs.adapter == 'opencode' || steps.select.outputs.adapter == 'cursor'
      shell: bash
      env:
        EXPECTED_PATHS: ${{ inputs.expected-paths }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
      run: |
        set -euo pipefail
        paths="$ALLOWED_PATHS"
        if [ -z "$paths" ]; then
          paths="$EXPECTED_PATHS"
        fi
        if [ -z "$paths" ]; then
          echo "::error::An isolated adapter fallback requires expected-paths or allowed-paths."
          exit 1
        fi
        {
          echo "paths<<__ISOLATED_ALLOWED_PATHS__"
          echo "$paths"
          echo "__ISOLATED_ALLOWED_PATHS__"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Claude sandbox
      if: steps.select.outputs.adapter == 'agent-run'
      uses: ./.github/actions/setup-claude-sandbox

    # Cross-adapter fallback is opt-in per lane in the routing SSOT. The
    # isolated child receives the exact caller prompt and output path contract,
    # and imports only one validated commit back into the host checkout.
    - name: Run agent with isolated OpenCode
      id: run-opencode
      if: steps.select.outputs.adapter == 'opencode'
      uses: ./.github/actions/run-opencode-container
      with:
        mode: ${{ inputs.opencode-mode }}
        lane: ${{ inputs.lane }}
        allowed-paths: ${{ steps.isolated-contract.outputs.paths }}
        model: ${{ steps.select.outputs.provider }}/${{ steps.select.outputs.model-id }}
        opencode-api-key: ${{ inputs.opencode-api-key }}
        prompt-text: ${{ inputs.prompt }}

    - name: Run agent with isolated Cursor
      id: run-cursor
      if: steps.select.outputs.adapter == 'cursor'
      uses: ./.github/actions/run-cursor-container
      with:
        mode: ${{ inputs.cursor-mode }}
        lane: ${{ inputs.lane }}
        allowed-paths: ${{ steps.isolated-contract.outputs.paths }}
        model: ${{ steps.select.outputs.provider }}/${{ steps.select.outputs.model-id }}
        cursor-api-key: ${{ inputs.cursor-api-key }}
        prompt-text: ${{ inputs.prompt }}

    # Native-Claude runs (requested backend=claude or Fireworks fallback)
    # serve the resolved native model (native-model input, else the SSOT's
    # global fallback.native_model): the workflows' `--model opus` alias is
    # remapped the same way the Fireworks steps below remap it to the
    # profile model. Haiku alias is left alone so cheap subagent calls
    # stay cheap.
    - name: Run agent with Claude
      id: run-claude
      if: steps.select.outputs.provider == 'claude' && inputs.allowed-bots == ''
      # continue-on-error so the step below can classify HOW it ended. A
      # non-dead-start failure is re-raised there, so this is not a swallow.
      continue-on-error: true
      uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
      env:
        ANTHROPIC_MODEL: ${{ steps.select.outputs.native-model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.select.outputs.native-model }}
        ARA_AGENT_BACKEND: claude
        ARA_AGENT_MODEL_ID: ${{ steps.select.outputs.native-model }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        claude_args: ${{ inputs.claude-args }}
        prompt: ${{ inputs.prompt }}

    - name: Run agent with Claude
      id: run-claude-bots
      if: steps.select.outputs.provider == 'claude' && inputs.allowed-bots != ''
      continue-on-error: true
      uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
      env:
        ANTHROPIC_MODEL: ${{ steps.select.outputs.native-model }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.select.outputs.native-model }}
        ARA_AGENT_BACKEND: claude
        ARA_AGENT_MODEL_ID: ${{ steps.select.outputs.native-model }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        claude_args: ${{ inputs.claude-args }}
        prompt: ${{ inputs.prompt }}

    # POST-AGENT THROTTLE FALLBACK. The pre-agent OAuth probe cannot see a
    # real throttle (a healthy token answers the raw ping 429 unconditionally),
    # so the Claude step runs first and its transcript is classified here.
    # Only a DEAD-START — is_error with <=1 turn and $0, the signature of a
    # throttled or rejected credential — may hand the SAME prompt to the next
    # chain candidate: nothing was written, so a clean re-run is safe. A
    # failure after real work is re-raised: partial edits may sit in the
    # checkout and a second model must never silently finish another's job.
    - name: Classify native Claude outcome
      id: claude-outcome
      if: steps.select.outputs.provider == 'claude'
      shell: bash
      env:
        STEP_OUTCOME: ${{ inputs.allowed-bots == '' && steps.run-claude.outcome || steps.run-claude-bots.outcome }}
        EXEC_FILE: ${{ steps.run-claude.outputs.execution_file || steps.run-claude-bots.outputs.execution_file }}
        LABEL: ${{ inputs.label }}
        PRE_SHA: ${{ steps.pre.outputs.sha }}
        EXPECTED_PATHS: ${{ inputs.expected-paths }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
      run: |
        set -euo pipefail
        if [ "$STEP_OUTCOME" = "success" ]; then
          echo "dead-start=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        verdict_file="$(mktemp)"
        python3 scripts/classify_claude_execution.py ${EXEC_FILE:+"$EXEC_FILE"} --github-output "$verdict_file"
        outcome="$(sed -n 's/^outcome=//p' "$verdict_file" | head -n1)"
        reason="$(sed -n 's/^reason=//p' "$verdict_file" | head -n1)"
        rm -f "$verdict_file"
        if [ "$outcome" = "dead-start" ]; then
          # Belt and braces: the transcript says nothing was written; prove it
          # against the checkout too. HEAD must still be the pre-run SHA and
          # no tracked or untracked file under the output contract may have
          # changed — otherwise a fallback runner's import plus the later
          # "Commit expected-path changes" step could merge two models' work.
          leftovers=""
          if [ "$(git rev-parse HEAD)" != "$PRE_SHA" ]; then
            leftovers="HEAD moved from ${PRE_SHA}"
          fi
          paths="$ALLOWED_PATHS"
          [ -z "$paths" ] && paths="$EXPECTED_PATHS"
          pathspecs=()
          while IFS= read -r pathspec; do
            pathspec="${pathspec#"${pathspec%%[![:space:]]*}"}"
            pathspec="${pathspec%"${pathspec##*[![:space:]]}"}"
            [ -z "$pathspec" ] && continue
            pathspecs+=("$pathspec")
          done <<< "$paths"
          if [ "${#pathspecs[@]}" -gt 0 ] && [ -n "$(git status --porcelain -- "${pathspecs[@]}")" ]; then
            leftovers="${leftovers:+$leftovers; }uncommitted changes under the output contract"
          fi
          if [ -n "$leftovers" ]; then
            echo "dead-start=false" >> "$GITHUB_OUTPUT"
            echo "::error::${LABEL}: transcript looks like a Claude dead-start (${reason}) but the checkout is not clean (${leftovers}). Refusing the post-agent fallback so two models' work cannot be merged."
            exit 1
          fi
          echo "::warning::${LABEL}: native Claude died before doing work — ${reason}. Re-walking the lane fallback chain post-agent."
          echo "dead-start=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "dead-start=false" >> "$GITHUB_OUTPUT"
        echo "::error::${LABEL}: native Claude step failed (${outcome}) — ${reason}. Not a dead-start, so no fallback is attempted."
        exit 1

    # Same selector, same lane/global chain, same strictness and eligibility
    # rules — with Claude marked unavailable. A strict lane or an exhausted
    # chain exits 1 here and the run stays red (fail-closed, as before).
    - name: Re-select backend after Claude dead-start
      id: reselect
      if: steps.claude-outcome.outputs.dead-start == 'true'
      shell: bash
      env:
        LANE: ${{ inputs.lane }}
        BACKEND_OVERRIDE: ${{ inputs.backend }}
        NATIVE_MODEL_OVERRIDE: ${{ inputs.native-model }}
        FALLBACK_POLICY: ${{ inputs.fireworks-fallback }}
        FIREWORKS_API_KEY: ${{ inputs.fireworks-api-key }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        CURSOR_API_KEY: ${{ inputs.cursor-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
      run: |
        set -euo pipefail
        args=(--github-output "$GITHUB_OUTPUT" --fallback-policy "${FALLBACK_POLICY:-claude}" --exclude-backend claude)
        if [ -n "$BACKEND_OVERRIDE" ]; then
          args+=(--backend "$BACKEND_OVERRIDE")
        else
          args+=(--lane "$LANE")
        fi
        if [ -n "$NATIVE_MODEL_OVERRIDE" ]; then
          args+=(--native-model-override "$NATIVE_MODEL_OVERRIDE")
        fi
        python3 scripts/select_backend.py "${args[@]}"

    - name: Resolve isolated editorial path contract (post-agent fallback)
      id: isolated-contract-fallback
      if: steps.reselect.outputs.adapter == 'opencode' || steps.reselect.outputs.adapter == 'cursor'
      shell: bash
      env:
        EXPECTED_PATHS: ${{ inputs.expected-paths }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
      run: |
        set -euo pipefail
        paths="$ALLOWED_PATHS"
        if [ -z "$paths" ]; then
          paths="$EXPECTED_PATHS"
        fi
        if [ -z "$paths" ]; then
          echo "::error::An isolated adapter fallback requires expected-paths or allowed-paths."
          exit 1
        fi
        {
          echo "paths<<__ISOLATED_ALLOWED_PATHS__"
          echo "$paths"
          echo "__ISOLATED_ALLOWED_PATHS__"
        } >> "$GITHUB_OUTPUT"

    # Only the providers that appear in a lane or global chain have a
    # post-agent runner. Anything else is a hard error rather than a silent
    # no-op that the output guard would report as a confusing "no output".
    - name: Verify the reselected backend has a post-agent runner
      if: steps.reselect.outcome == 'success'
      shell: bash
      env:
        ADAPTER: ${{ steps.reselect.outputs.adapter }}
        PROVIDER: ${{ steps.reselect.outputs.provider }}
        BACKEND: ${{ steps.reselect.outputs.backend }}
      run: |
        set -euo pipefail
        case "${ADAPTER}/${PROVIDER}" in
          opencode/*|cursor/*|agent-run/zai) ;;
          *) echo "::error::post-agent fallback selected '${BACKEND}' (adapter=${ADAPTER}, provider=${PROVIDER}) but agent-run has no post-agent runner for it."; exit 1 ;;
        esac

    - name: Run agent with isolated OpenCode (post-agent fallback)
      id: run-opencode-fallback
      if: steps.reselect.outputs.adapter == 'opencode'
      uses: ./.github/actions/run-opencode-container
      with:
        mode: ${{ inputs.opencode-mode }}
        lane: ${{ inputs.lane }}
        allowed-paths: ${{ steps.isolated-contract-fallback.outputs.paths }}
        model: ${{ steps.reselect.outputs.provider }}/${{ steps.reselect.outputs.model-id }}
        opencode-api-key: ${{ inputs.opencode-api-key }}
        prompt-text: ${{ inputs.prompt }}

    - name: Run agent with isolated Cursor (post-agent fallback)
      id: run-cursor-fallback
      if: steps.reselect.outputs.adapter == 'cursor'
      uses: ./.github/actions/run-cursor-container
      with:
        mode: ${{ inputs.cursor-mode }}
        lane: ${{ inputs.lane }}
        allowed-paths: ${{ steps.isolated-contract-fallback.outputs.paths }}
        model: ${{ steps.reselect.outputs.provider }}/${{ steps.reselect.outputs.model-id }}
        cursor-api-key: ${{ inputs.cursor-api-key }}
        prompt-text: ${{ inputs.prompt }}

    - name: Run agent with Z.ai (post-agent fallback)
      id: run-zai-fallback
      if: steps.reselect.outputs.provider == 'zai' && inputs.allowed-bots == ''
      uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
      env:
        ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.zai-api-key }}
        ANTHROPIC_MODEL: ${{ steps.reselect.outputs.model-id }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.reselect.outputs.model-id }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.reselect.outputs.model-id }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.reselect.outputs.model-id }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.reselect.outputs.model-id }}
        CLAUDE_CODE_EFFORT_LEVEL: max
        CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
        API_TIMEOUT_MS: "3000000"
        ARA_AGENT_BACKEND: ${{ steps.reselect.outputs.backend }}
        ARA_AGENT_MODEL_ID: ${{ steps.reselect.outputs.model-id }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        claude_args: ${{ inputs.claude-args }}
        prompt: ${{ inputs.prompt }}

    - name: Run agent with Z.ai (post-agent fallback)
      id: run-zai-fallback-bots
      if: steps.reselect.outputs.provider == 'zai' && inputs.allowed-bots != ''
      uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
      env:
        ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.zai-api-key }}
        ANTHROPIC_MODEL: ${{ steps.reselect.outputs.model-id }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.reselect.outputs.model-id }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.reselect.outputs.model-id }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.reselect.outputs.model-id }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.reselect.outputs.model-id }}
        CLAUDE_CODE_EFFORT_LEVEL: max
        CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
        API_TIMEOUT_MS: "3000000"
        ARA_AGENT_BACKEND: ${{ steps.reselect.outputs.backend }}
        ARA_AGENT_MODEL_ID: ${{ steps.reselect.outputs.model-id }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        claude_args: ${{ inputs.claude-args }}
        prompt: ${{ inputs.prompt }}

    - name: Run agent with Fireworks
      id: run-fireworks
      if: steps.select.outputs.provider == 'fireworks' && inputs.allowed-bots == ''
      uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
      env:
        ANTHROPIC_BASE_URL: https://api.fireworks.ai/inference
        ANTHROPIC_API_KEY: ${{ inputs.fireworks-api-key }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.fireworks-api-key }}
        ANTHROPIC_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.select.outputs.model-id }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.select.outputs.model-id }}
        CLAUDE_CODE_EFFORT_LEVEL: max
        ARA_AGENT_BACKEND: ${{ steps.select.outputs.backend }}
        ARA_AGENT_MODEL_ID: ${{ steps.select.outputs.model-id }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        claude_args: ${{ inputs.claude-args }}
        prompt: ${{ inputs.prompt }}

    - name: Run agent with Fireworks
      id: run-fireworks-bots
      if: steps.select.outputs.provider == 'fireworks' && inputs.allowed-bots != ''
      uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
      env:
        ANTHROPIC_BASE_URL: https://api.fireworks.ai/inference
        ANTHROPIC_API_KEY: ${{ inputs.fireworks-api-key }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.fireworks-api-key }}
        ANTHROPIC_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.select.outputs.model-id }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.select.outputs.model-id }}
        CLAUDE_CODE_EFFORT_LEVEL: max
        ARA_AGENT_BACKEND: ${{ steps.select.outputs.backend }}
        ARA_AGENT_MODEL_ID: ${{ steps.select.outputs.model-id }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        claude_args: ${{ inputs.claude-args }}
        prompt: ${{ inputs.prompt }}

    - name: Run agent with Z.ai
      id: run-zai
      if: steps.select.outputs.provider == 'zai' && inputs.allowed-bots == ''
      uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
      env:
        ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.zai-api-key }}
        ANTHROPIC_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.select.outputs.model-id }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.select.outputs.model-id }}
        CLAUDE_CODE_EFFORT_LEVEL: max
        CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
        API_TIMEOUT_MS: "3000000"
        ARA_AGENT_BACKEND: ${{ steps.select.outputs.backend }}
        ARA_AGENT_MODEL_ID: ${{ steps.select.outputs.model-id }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        claude_args: ${{ inputs.claude-args }}
        prompt: ${{ inputs.prompt }}

    - name: Run agent with Z.ai
      id: run-zai-bots
      if: steps.select.outputs.provider == 'zai' && inputs.allowed-bots != ''
      uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
      env:
        ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.zai-api-key }}
        ANTHROPIC_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ steps.select.outputs.model-id }}
        ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ steps.select.outputs.model-id }}
        CLAUDE_CODE_SUBAGENT_MODEL: ${{ steps.select.outputs.model-id }}
        CLAUDE_CODE_EFFORT_LEVEL: max
        CLAUDE_CODE_AUTO_COMPACT_WINDOW: "1000000"
        API_TIMEOUT_MS: "3000000"
        ARA_AGENT_BACKEND: ${{ steps.select.outputs.backend }}
        ARA_AGENT_MODEL_ID: ${{ steps.select.outputs.model-id }}
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        allowed_bots: ${{ inputs.allowed-bots }}
        claude_args: ${{ inputs.claude-args }}
        prompt: ${{ inputs.prompt }}

    - name: Clean sandbox probe
      shell: bash
      run: rm -f .tmp-sandbox-probe.txt

    - name: Commit expected-path changes
      if: inputs.expected-paths != ''
      shell: bash
      env:
        EXPECTED_PATHS: ${{ inputs.expected-paths }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
        LABEL: ${{ inputs.label }}
        PRE_SHA: ${{ steps.pre.outputs.sha }}
      run: |
        set -euo pipefail

        paths="$ALLOWED_PATHS"
        if [ -z "$paths" ]; then
          paths="$EXPECTED_PATHS"
        fi

        pathspecs=()
        while IFS= read -r pathspec; do
          pathspec="${pathspec#"${pathspec%%[![:space:]]*}"}"
          pathspec="${pathspec%"${pathspec##*[![:space:]]}"}"
          [ -z "$pathspec" ] && continue
          pathspecs+=("$pathspec")
        done <<< "$paths"

        if [ "${#pathspecs[@]}" -eq 0 ]; then
          exit 0
        fi

        # Research outputs are public artifacts, never hidden scratch files.
        # Reject diagnostic probes before staging so a failed sandbox check
        # cannot satisfy the output contract or be auto-merged as lane data.
        hidden_outputs=()
        add_hidden_output() {
          local candidate="$1"
          local existing
          for existing in "${hidden_outputs[@]}"; do
            [ "$existing" = "$candidate" ] && return
          done
          hidden_outputs+=("$candidate")
        }
        inspect_output_path() {
          local candidate="$1"
          local component
          local components=()
          IFS='/' read -r -a components <<< "$candidate"
          for component in "${components[@]}"; do
            if [[ "$component" == .* ]]; then
              add_hidden_output "$candidate"
              return
            fi
          done
        }
        while IFS= read -r -d '' candidate; do
          inspect_output_path "$candidate"
        done < <(
          {
            git ls-files --others --modified --exclude-standard -z -- "${pathspecs[@]}"
            git diff --name-only -z "${PRE_SHA}..HEAD" -- "${pathspecs[@]}"
          }
        )
        if [ "${#hidden_outputs[@]}" -gt 0 ]; then
          echo "::error::${LABEL} produced hidden diagnostic file(s); refusing to commit them:"
          printf '  - %s\n' "${hidden_outputs[@]}"
          exit 1
        fi

        git add -- "${pathspecs[@]}"
        if git diff --cached --quiet -- "${pathspecs[@]}"; then
          echo "${LABEL} left no uncommitted changes under allowed output path(s)."
          exit 0
        fi

        git commit -m "${LABEL} output"

    - name: Capture post-run HEAD
      id: post
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Resolve allowed diff paths
      id: allowed
      if: inputs.expected-paths != ''
      shell: bash
      env:
        EXPECTED_PATHS: ${{ inputs.expected-paths }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
      run: |
        set -euo pipefail
        paths="$ALLOWED_PATHS"
        if [ -z "$paths" ]; then
          paths="$EXPECTED_PATHS"
        fi
        {
          echo "paths<<__ALLOWED_PATHS__"
          echo "$paths"
          echo "__ALLOWED_PATHS__"
        } >> "$GITHUB_OUTPUT"

    - name: Require committed output
      id: guard
      if: inputs.expected-paths != ''
      uses: ./.github/actions/require-output
      with:
        base-sha: ${{ steps.pre.outputs.sha }}
        expected-paths: ${{ inputs.expected-paths }}
        label: ${{ inputs.label }}

    - name: Require committed diff scope
      id: scope
      if: inputs.expected-paths != ''
      uses: ./.github/actions/require-diff-scope
      with:
        base-sha: ${{ steps.pre.outputs.sha }}
        allowed-paths: ${{ steps.allowed.outputs.paths }}
        label: ${{ inputs.label }}
