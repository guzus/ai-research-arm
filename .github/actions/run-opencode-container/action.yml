name: Run opencode in container
description: >-
  Run the opencode agent inside a Docker container with only the workflow
  workspace's disposable clone, the rendered prompt, and (optionally) the
  Twitter snapshot mounted. The real checkout is never writable by the agent.

# WHY THIS EXISTS
#
# opencode was the one agent harness in this repo with no containment. Claude
# lanes get the bubblewrap sandbox from the checked-in .claude/settings.json
# (failIfUnavailable: true, allowUnsandboxedCommands: false, denyRead on ~/,
# /proc, ~/.ssh, ~/.aws, and env denies on every provider token). pi lanes get
# .github/actions/run-pi-container. opencode read NEITHER: it ran bare on the
# self-hosted host with `permission: {edit,bash,webfetch}: allow` plus `--auto`,
# which auto-approves anything not explicitly denied.
#
# That mattered because generative-research.yml triggers on `issues: [opened,
# labeled]` and its twitter_url path feeds live tweets, replies and images to
# the agent. Attacker-influenced text reaching an agent that holds unsandboxed
# host bash on a runner with a PERSISTENT home — where other lanes' credentials
# live — is a prompt-injection blast radius, not a theoretical one. The prior
# containment was prose in the prompt ("do not exfiltrate env") plus Actions log
# masking; neither is enforcement.
#
# This mirrors run-pi-container: same --cap-drop ALL, --security-opt
# no-new-privileges, --pids-limit, non-root --user matching the host uid so
# writes into the disposable clone keep correct ownership, and a container HOME
# under /tmp so the agent never sees the runner's real home. The host imports
# only a validated one-commit static bundle plus explicitly named data files.
#
# Missing Docker is a HARD FAILURE. Never fall back to host-level `opencode
# run` — that is exactly the posture this action removes.

inputs:
  mode:
    description: Output contract to enforce after the isolated agent run (generative, twitter, or canary).
    required: true
  allowed-paths:
    description: >-
      Exact newline-delimited commit paths allowed in twitter mode. Ignored in
      generative/canary modes, whose contracts are built in.
    required: false
    default: ''
  prompt-file:
    description: >-
      Path to the rendered prompt file (host path). Exactly one of
      prompt-file / prompt-text is required; that is enforced at runtime rather
      than by `required: true`, which cannot express either/or.
    required: false
    default: ''
  model:
    description: Fully-qualified opencode model ref, e.g. opencode-go/deepseek-v4-flash.
    required: true
  opencode-api-key:
    description: OPENCODE_API_KEY (OpenCode Go subscription).
    required: true
  opencode-config:
    description: Workspace-relative path to the opencode config to inject.
    required: false
    default: .github/opencode/opencode.json
  timeout-minutes:
    description: Hard wall-clock cap on the agent turn, enforced inside the container.
    required: false
    default: '45'
  mount-bird-snapshot:
    description: >-
      Mount /tmp/bird read-only. The Twitter lanes read a pre-fetched snapshot
      from there; generative-research does not.
    required: false
    default: 'false'
  bird-auth-token:
    description: X/Twitter auth_token cookie, for birdy calls made by the agent.
    required: false
    default: ''
  bird-ct0:
    description: X/Twitter ct0 cookie, for birdy calls made by the agent.
    required: false
    default: ''
  birdy-tool-log-path:
    description: Workspace-relative path for birdy's tool log, if the lane collects one.
    required: false
    default: ''
  gen-slug:
    description: GEN_SLUG for the generative-research lane.
    required: false
    default: ''
  gen-source:
    description: GEN_SOURCE for the generative-research lane.
    required: false
    default: ''
  gen-draft:
    description: >-
      GEN_DRAFT for the generative-research lane. Only the BASENAME is used:
      the host path lives under $RUNNER_TEMP, which the non-root container user
      cannot even mkdir (`/home/<runner>/... Permission denied`), and mounting
      $RUNNER_TEMP would hand the agent every other job's leftovers on a
      persistent runner. The draft is written and read entirely within one
      agent turn — the writer persists the .ara.md into research/generative/
      on success — so it is remapped to a container-local path instead.
    required: false
    default: ''
  git-user-name:
    description: >-
      Commit identity for writers that commit from inside the container
      (generative-research's write_generative_research.py does). Passed as
      GIT_AUTHOR_*/GIT_COMMITTER_* rather than written to config, because the
      container HOME and isolated clone are both throwaway.
    required: false
    default: github-actions[bot]
  git-user-email:
    description: Commit identity email (see git-user-name).
    required: false
    default: 41898282+github-actions[bot]@users.noreply.github.com
  prompt-text:
    description: >-
      Inline prompt, used instead of prompt-file. For short probes (the canary)
      that have no rendered file. Exactly one of prompt-file / prompt-text.
    required: false
    default: ''
  output-file:
    description: >-
      Host path to tee the agent's stdout to, for lanes that assert on what the
      agent said (the canary greps for its token). Written on the host, so it
      needs no mount and the container cannot tamper with it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build and run opencode container
      shell: bash
      env:
        RUN_MODE: ${{ inputs.mode }}
        ALLOWED_PATHS: ${{ inputs.allowed-paths }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        PROMPT_TEXT: ${{ inputs.prompt-text }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        OPENCODE_MODEL_REF: ${{ inputs.model }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        OPENCODE_CONFIG_REL: ${{ inputs.opencode-config }}
        AGENT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        MOUNT_BIRD_SNAPSHOT: ${{ inputs.mount-bird-snapshot }}
        AUTH_TOKEN: ${{ inputs.bird-auth-token }}
        CT0: ${{ inputs.bird-ct0 }}
        BIRDY_TOOL_LOG_REL: ${{ inputs.birdy-tool-log-path }}
        GEN_SLUG: ${{ inputs.gen-slug }}
        GEN_SOURCE: ${{ inputs.gen-source }}
        GEN_DRAFT: ${{ inputs.gen-draft }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail

        if ! command -v docker >/dev/null 2>&1; then
          echo "::error::Docker is required for sandboxed opencode runs. Refusing to fall back to host-level 'opencode run' — that is the unsandboxed posture this action exists to remove."
          exit 1
        fi

        # The self-hosted runner is persistent. Keep every per-run artifact
        # scoped to this invocation and remove it on success, failure, timeout,
        # or cancellation so repeated scheduled runs cannot fill its disk.
        build_dir=""
        isolated_workspace=""
        image=""
        staged_prompt=""
        cleanup() {
          exit_code=$?
          trap - EXIT
          if [ -n "$image" ] && docker image inspect "$image" >/dev/null 2>&1; then
            docker image rm -f "$image" >/dev/null 2>&1 \
              || echo "::warning::Failed to remove opencode image $image"
          fi
          if [ -n "$build_dir" ] && [ -d "$build_dir" ]; then
            rm -rf -- "$build_dir" \
              || echo "::warning::Failed to remove opencode build directory $build_dir"
          fi
          if [ -n "$isolated_workspace" ] && [ -d "$isolated_workspace" ]; then
            rm -rf -- "$isolated_workspace" \
              || echo "::warning::Failed to remove isolated opencode workspace $isolated_workspace"
          fi
          if [ -n "$staged_prompt" ] && [ -f "$staged_prompt" ]; then
            rm -f -- "$staged_prompt" \
              || echo "::warning::Failed to remove staged opencode prompt $staged_prompt"
          fi
          exit "$exit_code"
        }
        trap cleanup EXIT

        if [ -n "$PROMPT_FILE" ] && [ -n "$PROMPT_TEXT" ]; then
          echo "::error::Pass exactly one of prompt-file / prompt-text, not both."
          exit 1
        fi
        if [ -z "$PROMPT_FILE" ] && [ -z "$PROMPT_TEXT" ]; then
          echo "::error::One of prompt-file / prompt-text is required."
          exit 1
        fi
        case "$RUN_MODE" in
          generative|twitter|canary) ;;
          *)
            echo "::error::mode must be one of: generative, twitter, canary (got '$RUN_MODE')."
            exit 1
            ;;
        esac
        if [ "$RUN_MODE" = "twitter" ] && [ -z "$ALLOWED_PATHS" ]; then
          echo "::error::twitter mode requires exact allowed-paths."
          exit 1
        fi
        case "$OPENCODE_CONFIG_REL" in
          /*|../*|*/../*|*/..|.git/*)
            echo "::error::opencode-config must be a workspace-relative non-git path."
            exit 1
            ;;
        esac
        if [ -n "$BIRDY_TOOL_LOG_REL" ]; then
          case "$BIRDY_TOOL_LOG_REL" in
            .twitter-input/*) ;;
            *)
              echo "::error::birdy-tool-log-path must stay under .twitter-input/."
              exit 1
              ;;
          esac
          case "$BIRDY_TOOL_LOG_REL" in
            */../*|../*|*/..)
              echo "::error::birdy-tool-log-path cannot traverse directories."
              exit 1
              ;;
          esac
        fi
        if [ "$RUN_MODE" = "twitter" ]; then
          allowed_count=0
          while IFS= read -r allowed_path; do
            [ -z "$allowed_path" ] && continue
            allowed_count=$((allowed_count + 1))
            case "$allowed_path" in
              research/*) ;;
              *)
                echo "::error::twitter allowed path must stay under research/: $allowed_path"
                exit 1
                ;;
            esac
            case "$allowed_path" in
              */../*|../*|*/..|*.git/*)
                echo "::error::twitter allowed path traverses a forbidden directory: $allowed_path"
                exit 1
                ;;
            esac
          done <<< "$ALLOWED_PATHS"
          if [ "$allowed_count" -lt 1 ] || [ "$allowed_count" -gt 8 ]; then
            echo "::error::twitter allowed-paths must contain 1-8 exact paths."
            exit 1
          fi
        fi
        if [ -n "$PROMPT_FILE" ] && [ ! -f "$PROMPT_FILE" ]; then
          echo "::error::opencode prompt file not found: $PROMPT_FILE"
          exit 1
        fi
        # An inline prompt is staged to a run-scoped file so both paths mount
        # the prompt identically read-only.
        if [ -n "$PROMPT_TEXT" ]; then
          staged_prompt="${RUNNER_TEMP:-/tmp}/opencode-inline-prompt-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}.md"
          PROMPT_FILE="$staged_prompt"
          printf '%s' "$PROMPT_TEXT" > "$PROMPT_FILE"
        fi
        if [ ! -f "$GITHUB_WORKSPACE/$OPENCODE_CONFIG_REL" ]; then
          echo "::error::opencode config not found: $OPENCODE_CONFIG_REL"
          exit 1
        fi
        # TRUSTED_BIRD_MOUNT_GUARD_BEGIN
        if [ "$MOUNT_BIRD_SNAPSHOT" = "true" ]; then
          bird_root=/tmp/bird
          canonical_bird_parent=$(realpath -- "$(dirname -- "$bird_root")")
          if [ ! -d "$bird_root" ] || [ -L "$bird_root" ] \
            || [ "$(realpath -- "$bird_root")" \
              != "$canonical_bird_parent/$(basename -- "$bird_root")" ]; then
            echo "::error::Twitter fetch directory /tmp/bird is missing, linked, or noncanonical."
            exit 1
          fi
          if ! unsafe_bird_entry=$(find "$bird_root" -mindepth 1 \
            \! -type d \! -type f -print -quit); then
            echo "::error::Could not audit the Twitter snapshot before mounting it."
            exit 1
          fi
          if [ -n "$unsafe_bird_entry" ]; then
            echo "::error::Twitter snapshot contains a linked or special entry: $unsafe_bird_entry"
            exit 1
          fi
        fi
        # TRUSTED_BIRD_MOUNT_GUARD_END

        build_dir="${RUNNER_TEMP:-/tmp}/opencode-container-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        rm -rf "$build_dir"
        mkdir -p "$build_dir"
        empty_git_template="$build_dir/empty-git-template"
        mkdir -p "$empty_git_template"

        # Never give the agent a writable mount of the real checkout. A local,
        # no-hardlink clone carries the same committed tree but has disposable
        # git metadata, hooks, ignored files, and virtualenv state. The trusted
        # host shell below imports a commit only after validating its exact diff.
        # TRUSTED_CLONE_SETUP_BEGIN
        workspace_root=$(realpath -- "$GITHUB_WORKSPACE")
        git_dir="$workspace_root/.git"
        if [ ! -d "$git_dir" ] || [ -L "$git_dir" ] \
          || [ "$(realpath -- "$git_dir")" != "$workspace_root/.git" ]; then
          echo "::error::Real checkout .git must be a canonical directory inside GITHUB_WORKSPACE."
          exit 1
        fi
        # A linked-worktree commondir redirects config, refs, and objects before
        # Git consults any -c override. These jobs use a normal checkout, so a
        # persisted commondir is stale/hostile metadata, never required state.
        rm -f -- "$git_dir/commondir"
        for git_control_dir in "$git_dir/objects" "$git_dir/objects/info" \
          "$git_dir/refs" "$git_dir/info"; do
          if [ ! -d "$git_control_dir" ] || [ -L "$git_control_dir" ] \
            || [ "$(realpath -- "$git_control_dir")" != "$git_control_dir" ]; then
            echo "::error::Real checkout has a linked or malformed Git control directory: $git_control_dir"
            exit 1
          fi
        done
        for required_git_file in "$git_dir/HEAD" "$git_dir/index"; do
          if [ ! -f "$required_git_file" ] || [ -L "$required_git_file" ] \
            || [ "$(realpath -- "$required_git_file")" != "$required_git_file" ]; then
            echo "::error::Real checkout has a linked or malformed Git control file: $required_git_file"
            exit 1
          fi
        done
        if [ -e "$git_dir/packed-refs" ] || [ -L "$git_dir/packed-refs" ]; then
          if [ ! -f "$git_dir/packed-refs" ] || [ -L "$git_dir/packed-refs" ] \
            || [ "$(realpath -- "$git_dir/packed-refs")" != "$git_dir/packed-refs" ]; then
            echo "::error::Real checkout packed-refs is linked or malformed."
            exit 1
          fi
        fi
        if [[ ! "${GITHUB_SERVER_URL:-}" =~ ^https://[^/[:space:]]+(/[^[:space:]]*)?$ ]] \
          || [[ ! "${GITHUB_REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
          echo "::error::Trusted GitHub origin coordinates are malformed."
          exit 1
        fi
        trusted_origin="${GITHUB_SERVER_URL%/}/${GITHUB_REPOSITORY}.git"

        # This checkout persists across jobs. Replace executable local Git
        # configuration before the FIRST Git command and remove every local
        # metadata bridge that can redirect object lookup, attributes, hooks,
        # or later safe-push transport. Callers use persist-credentials:false;
        # safe-push supplies its own one-command authorization header.
        trusted_config=$(mktemp "$git_dir/config.opencode.XXXXXX")
        {
          printf '%s\n' '[core]'
          printf '%s\n' '  repositoryformatversion = 0'
          printf '%s\n' '  filemode = true'
          printf '%s\n' '  bare = false'
          printf '%s\n' '  logallrefupdates = false'
          printf '%s\n' '[user]'
          printf '%s\n' '  name = github-actions[bot]'
          printf '%s\n' '  email = 41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' '[remote "origin"]'
          printf '  url = %s\n' "$trusted_origin"
          printf '%s\n' '  fetch = +refs/heads/*:refs/remotes/origin/*'
        } > "$trusted_config"
        chmod 600 "$trusted_config"
        mv -f -- "$trusted_config" "$git_dir/config"
        rm -f -- "$git_dir/config.worktree" "$git_dir/info/attributes" \
          "$git_dir/info/grafts" "$git_dir/objects/info/alternates" \
          "$git_dir/objects/info/http-alternates"
        rm -rf -- "$git_dir/hooks" "$git_dir/logs" "$git_dir/refs/replace"
        mkdir -p "$git_dir/hooks"
        if ! bad_ref_path=$(find "$git_dir/refs" -mindepth 1 \
          \! -type d \! -type f -print -quit) \
          || ! bad_object_path=$(find "$git_dir/objects" -mindepth 1 \
          \! -type d \! -type f -print -quit); then
          echo "::error::Could not audit real checkout refs/objects control paths."
          exit 1
        fi
        if [ -n "$bad_ref_path" ] || [ -n "$bad_object_path" ]; then
          echo "::error::Real checkout refs/objects contain linked or special control paths."
          exit 1
        fi
        if [ -n "${GITHUB_ENV:-}" ]; then
          {
            printf '%s\n' 'GIT_CONFIG_NOSYSTEM=1'
            printf '%s\n' 'GIT_CONFIG_GLOBAL=/dev/null'
            printf '%s\n' 'GIT_NO_REPLACE_OBJECTS=1'
          } >> "$GITHUB_ENV"
        fi

        host_git=(env GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
          GIT_NO_REPLACE_OBJECTS=1 git -c core.fsmonitor=false \
          -c core.hooksPath=/dev/null -c core.attributesFile=/dev/null \
          -c core.sparseCheckout=false -c core.sparseCheckoutCone=false \
          -c index.sparse=false -c core.worktree="$workspace_root" \
          -C "$workspace_root")
        if ! "${host_git[@]}" diff --no-ext-diff --quiet \
          || ! "${host_git[@]}" diff --no-ext-diff --cached --quiet; then
          echo "::error::Real checkout has tracked changes before the opencode run."
          exit 1
        fi
        pre_sha=$("${host_git[@]}" rev-parse HEAD)
        isolated_workspace="${RUNNER_TEMP:-/tmp}/opencode-workspace-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        rm -rf "$isolated_workspace"
        env GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
          GIT_NO_REPLACE_OBJECTS=1 GIT_LFS_SKIP_SMUDGE=1 \
          git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
          -c core.attributesFile=/dev/null clone --quiet --no-hardlinks \
          --no-checkout --template="$empty_git_template" \
          "$GITHUB_WORKSPACE" "$isolated_workspace"
        isolated_pre_sha=$(env GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
          GIT_NO_REPLACE_OBJECTS=1 git -c core.fsmonitor=false \
          -c core.hooksPath=/dev/null -c core.attributesFile=/dev/null \
          -c core.worktree="$isolated_workspace" \
          -C "$isolated_workspace" rev-parse HEAD)
        if [ "$isolated_pre_sha" != "$pre_sha" ]; then
          echo "::error::Isolated opencode clone HEAD does not match the real checkout."
          exit 1
        fi
        if [ "$RUN_MODE" = "generative" ] && [ -d "$GITHUB_WORKSPACE/.gen-input" ]; then
          cp -a "$GITHUB_WORKSPACE/.gen-input" "$isolated_workspace/.gen-input"
        fi
        if [ "$RUN_MODE" = "twitter" ] && [ -d "$GITHUB_WORKSPACE/.twitter-input" ]; then
          cp -a "$GITHUB_WORKSPACE/.twitter-input" "$isolated_workspace/.twitter-input"
        fi
        # TRUSTED_CLONE_SETUP_END
        # Everything the two opencode lanes shell out to:
        #   generative-research -> uv run python (17 call sites), birdy, pdftotext, git, curl, jq
        #   hourly-twitter      -> birdy, jq
        # One image serves both. Agent/tool versions are pinned; the base image
        # tag and Debian package repositories remain mutable across rebuilds.
        cat > "$build_dir/Dockerfile" <<'EOF'
        FROM node:22-bookworm-slim
        RUN apt-get update \
          && apt-get install -y --no-install-recommends \
               ca-certificates curl git jq poppler-utils \
          && rm -rf /var/lib/apt/lists/*
        # --ignore-scripts stays on so no TRANSITIVE dependency gets to run
        # arbitrary install code, but opencode-ai genuinely needs its own
        # postinstall (it fetches the platform binary) and hard-fails without
        # it: "opencode-ai's postinstall script was not run." So run exactly
        # that one script, explicitly, instead of dropping the flag globally.
        RUN npm install -g --ignore-scripts opencode-ai@1.18.3 \
          && ( cd "$(npm root -g)/opencode-ai" && node postinstall.mjs )
        # birdy: single static Go binary since v1.0.0, no Node runtime.
        RUN set -eux; \
          arch="$(dpkg --print-architecture)"; \
          case "$arch" in amd64) a=amd64 ;; arm64) a=arm64 ;; *) echo "unsupported arch $arch" >&2; exit 1 ;; esac; \
          curl -fsSL "https://github.com/guzus/birdy/releases/download/v1.1.0/birdy_linux_${a}.tar.gz" -o /tmp/birdy.tgz; \
          tar -xzf /tmp/birdy.tgz -C /tmp; \
          install -m 755 /tmp/birdy /usr/local/bin/birdy; \
          rm -rf /tmp/birdy.tgz /tmp/birdy
        # The rendered Twitter prompt calls birdy-fast. The host wrapper talks
        # to a localhost daemon that is intentionally outside the container;
        # this wrapper preserves the command contract via the pinned binary,
        # forces read-only mode, and logs command names without arguments.
        COPY birdy-fast /usr/local/bin/birdy-fast
        RUN chmod 755 /usr/local/bin/birdy-fast
        # uv drives every `uv run python scripts/...` the research prompt makes.
        COPY --from=ghcr.io/astral-sh/uv:0.9.7 /uv /uvx /usr/local/bin/
        RUN birdy version && uv --version && opencode --version
        WORKDIR /workspace
        EOF

        image="ara-opencode-agent:${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        cp "$GITHUB_ACTION_PATH/birdy-fast" "$build_dir/birdy-fast"
        docker build --pull -t "$image" "$build_dir"

        # Optional mounts / env, assembled as arrays so empty values never
        # collapse into a stray argument.
        # Remap the draft into the container (see the gen-draft input docs).
        GEN_DRAFT_IN_CONTAINER=""
        if [ -n "$GEN_DRAFT" ]; then
          GEN_DRAFT_IN_CONTAINER="/tmp/opencode-home/$(basename "$GEN_DRAFT")"
        fi

        # Expanded below as ${extra_args[@]+"${extra_args[@]}"}: under `set -u`
        # a plain "${arr[@]}" on an EMPTY array is an unbound-variable error in
        # bash < 4.4. The Linux runner has 5.x so it would pass there and blow
        # up anywhere older — not worth the latent trap.
        extra_args=()
        if [ "$MOUNT_BIRD_SNAPSHOT" = "true" ]; then
          extra_args+=(--volume "/tmp/bird:/tmp/bird:ro")
        fi
        if [ -n "$BIRDY_TOOL_LOG_REL" ]; then
          extra_args+=(--env "BIRDY_TOOL_LOG_PATH=/workspace/${BIRDY_TOOL_LOG_REL#/}")
        fi

        # The agent's HOME is a throwaway inside the container: the runner's
        # real home holds other lanes' credentials and must never be reachable.
        # UV_* keep uv's python + cache inside the container too, so a package
        # download can't write to shared runner state.
        docker_cmd=(docker run --rm \
          --user "$(id -u):$(id -g)" \
          --workdir /workspace \
          --cap-drop ALL \
          --security-opt no-new-privileges \
          --pids-limit 512 \
          --env HOME=/tmp/opencode-home \
          --env XDG_CONFIG_HOME=/tmp/opencode-home/.config \
          --env XDG_DATA_HOME=/tmp/opencode-home/.local/share \
          --env XDG_CACHE_HOME=/tmp/opencode-home/.cache \
          --env UV_CACHE_DIR=/tmp/opencode-home/.cache/uv \
          --env UV_PYTHON_INSTALL_DIR=/tmp/opencode-home/.local/uv-python \
          --env UV_LINK_MODE=copy \
          --env OPENCODE_API_KEY \
          --env OPENCODE_DISABLE_AUTOUPDATE=1 \
          --env GITHUB_WORKSPACE=/workspace \
          --env "OPENCODE_CONFIG=/workspace/${OPENCODE_CONFIG_REL#/}" \
          --env AUTH_TOKEN \
          --env CT0 \
          --env BIRDY_READ_ONLY=1 \
          --env GEN_SLUG \
          --env GEN_SOURCE \
          --env "GEN_DRAFT=$GEN_DRAFT_IN_CONTAINER" \
          --env "GIT_AUTHOR_NAME=$GIT_USER_NAME" \
          --env "GIT_AUTHOR_EMAIL=$GIT_USER_EMAIL" \
          --env "GIT_COMMITTER_NAME=$GIT_USER_NAME" \
          --env "GIT_COMMITTER_EMAIL=$GIT_USER_EMAIL" \
          --env OPENCODE_MODEL_REF \
          --env AGENT_TIMEOUT_MINUTES \
          --env "PRE_SHA=$pre_sha" \
          ${extra_args[@]+"${extra_args[@]}"} \
          --volume "$isolated_workspace:/workspace" \
          --volume "$PROMPT_FILE:/tmp/opencode-prompt.md:ro" \
          "$image" \
          bash -lc '
            set -uo pipefail
            mkdir -p "$HOME" "$XDG_CONFIG_HOME"

            # The host deliberately cloned without a checkout, so neither
            # persistent global config nor a template hook can run there.
            # Materialize the tree only after entering the disposable
            # container, with config, hooks, and global attributes disabled.
            export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1
            git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
              -c core.attributesFile=/dev/null reset --hard "$PRE_SHA"
            if [ "$(git -c core.fsmonitor=false -c core.hooksPath=/dev/null \
              -c core.attributesFile=/dev/null rev-parse HEAD)" != "$PRE_SHA" ]; then
              echo "isolated opencode checkout does not match pre-run HEAD" >&2
              exit 1
            fi

            # Keep trusted git control state in non-exported shell variables;
            # the opencode child cannot mutate its parent shell variables.
            trusted_config=$(base64 -w0 .git/config)
            trusted_head=$(base64 -w0 .git/HEAD)
            trusted_packed=""
            if [ -f .git/packed-refs ]; then
              trusted_packed=$(base64 -w0 .git/packed-refs)
            fi

            set +e
            timeout "${AGENT_TIMEOUT_MINUTES}m" opencode run \
              -m "$OPENCODE_MODEL_REF" \
              --auto \
              "$(cat /tmp/opencode-prompt.md)"
            agent_status=$?
            set -e

            # This fixed container tail runs after the agent child exits. It
            # restores config/HEAD, removes hooks and object indirections, and
            # exports a static bundle. The host never fetches from this repo.
            for trusted_dir in .git .git/objects .git/objects/info .git/refs .git/info; do
              if [ ! -d "$trusted_dir" ] || [ -L "$trusted_dir" ]; then
                echo "isolated opencode run replaced trusted git directory: $trusted_dir" >&2
                exit 1
              fi
            done
            rm -f -- .git/config .git/HEAD .git/packed-refs
            printf "%s" "$trusted_config" | base64 -d > .git/config
            printf "%s" "$trusted_head" | base64 -d > .git/HEAD
            if [ -n "$trusted_packed" ]; then
              printf "%s" "$trusted_packed" | base64 -d > .git/packed-refs
            fi
            rm -rf -- .git/hooks .git/refs/replace
            mkdir -p .git/hooks
            rm -f -- .git/objects/info/alternates \
              .git/objects/info/http-alternates .git/info/grafts .git/shallow

            export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1
            post_sha=$(git rev-parse HEAD)
            rm -f -- .opencode-post-sha .opencode-export.bundle
            printf "%s\n" "$post_sha" > .opencode-post-sha
            if [ "$post_sha" != "$PRE_SHA" ]; then
              git bundle create .opencode-export.bundle HEAD "^$PRE_SHA"
            fi
            exit "$agent_status"
          ')

        # tee on the HOST, so the output file needs no mount and the container
        # cannot rewrite what the lane asserts on. Capture the container status
        # instead of exiting immediately: the trusted host must validate and,
        # when safe, import a writer commit even if opencode timed out afterward.
        set +e
        if [ -n "$OUTPUT_FILE" ]; then
          "${docker_cmd[@]}" | tee "$OUTPUT_FILE"
          agent_status=${PIPESTATUS[0]}
        else
          "${docker_cmd[@]}"
          agent_status=$?
        fi
        set -e

        # TRUSTED_IMPORT_GUARD_BEGIN
        # Import only a static bundle produced by the fixed container tail.
        # Do not use `git fetch` even with the bundle's absolute path: fetch is
        # transport-aware, so persisted url.*.insteadOf + core.sshCommand
        # settings in the real repo could rewrite that path and execute a host
        # helper. `git bundle unbundle` directly parses/indexes the local bundle
        # and neither resolves a transport URL nor updates a ref.
        post_file="$isolated_workspace/.opencode-post-sha"
        bundle_file="$isolated_workspace/.opencode-export.bundle"
        if [ ! -f "$post_file" ] || [ -L "$post_file" ] \
          || [ "$(wc -c < "$post_file")" -gt 128 ]; then
          echo "::error::opencode did not produce a valid regular post-SHA file."
          exit 1
        fi
        post_sha=$(tr -d '\r\n' < "$post_file")
        if [[ ! "$post_sha" =~ ^[0-9a-f]{40,64}$ ]]; then
          echo "::error::opencode post-SHA is malformed."
          exit 1
        fi

        trusted_git=(env GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
          GIT_NO_REPLACE_OBJECTS=1 git -c core.fsmonitor=false \
          -c core.hooksPath=/dev/null -c core.attributesFile=/dev/null \
          -c core.sparseCheckout=false -c core.sparseCheckoutCone=false \
          -c index.sparse=false \
          -c core.worktree="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE")
        import_paths=()
        import_statuses=()
        import_oids=()
        import_pre_oids=()
        if [ "$post_sha" != "$pre_sha" ]; then
          if [ ! -f "$bundle_file" ] || [ -L "$bundle_file" ] \
            || [ "$(wc -c < "$bundle_file")" -gt 20971520 ]; then
            echo "::error::opencode commit bundle is missing, linked, or exceeds 20 MiB."
            exit 1
          fi
          "${trusted_git[@]}" bundle verify "$bundle_file"
          bundle_heads=$("${trusted_git[@]}" bundle unbundle "$bundle_file")
          advertised_count=0
          advertised_head=""
          while read -r advertised_oid advertised_ref trailing; do
            [ -z "$advertised_oid" ] && continue
            advertised_count=$((advertised_count + 1))
            if [ "$advertised_ref" != "HEAD" ] || [ -n "${trailing:-}" ]; then
              echo "::error::Static opencode bundle advertises an unexpected ref."
              exit 1
            fi
            advertised_head="$advertised_oid"
          done <<< "$bundle_heads"
          if [ "$advertised_count" != "1" ] || [ "$advertised_head" != "$post_sha" ]; then
            echo "::error::Static opencode bundle HEAD does not match its declared post-SHA."
            exit 1
          fi
        elif [ -e "$bundle_file" ] || [ -L "$bundle_file" ]; then
          echo "::error::opencode emitted a bundle despite leaving HEAD unchanged."
          exit 1
        fi

        if ! "${trusted_git[@]}" merge-base --is-ancestor "$pre_sha" "$post_sha"; then
          echo "::error::opencode commit does not descend from the pre-run HEAD."
          exit 1
        fi
        if ! "${trusted_git[@]}" diff --no-ext-diff --quiet \
          || ! "${trusted_git[@]}" diff --no-ext-diff --cached --quiet \
          || [ "$("${trusted_git[@]}" rev-parse HEAD)" != "$pre_sha" ]; then
          echo "::error::Real checkout changed during the isolated opencode run."
          exit 1
        fi

        if [ "$post_sha" != "$pre_sha" ]; then
          if [ "$("${trusted_git[@]}" rev-list --count "$pre_sha..$post_sha")" != "1" ] \
            || [ "$("${trusted_git[@]}" rev-parse "$post_sha^")" != "$pre_sha" ]; then
            echo "::error::opencode must produce at most one direct child commit."
            exit 1
          fi
          if [ "$RUN_MODE" = "canary" ]; then
            echo "::error::canary opencode run created a commit."
            exit 1
          fi

          changed_count=0
          gen_index=0
          gen_html=0
          gen_source=0
          path_violation=0
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            changed_count=$((changed_count + 1))
            tree_entry=$("${trusted_git[@]}" ls-tree "$post_sha" -- "$path")
            tree_header="${tree_entry%%$'\t'*}"
            read -r tree_mode tree_type tree_oid <<< "$tree_header"
            if [ "$tree_mode" != "100644" ] || [ "$tree_type" != "blob" ] \
              || [ "$("${trusted_git[@]}" cat-file -s "$tree_oid" 2>/dev/null || echo 99999999)" -gt 5242880 ]; then
              echo "::error::opencode commit path is not a <=5 MiB regular non-executable blob: $path"
              path_violation=1
              continue
            fi
            import_paths+=("$path")
            import_statuses+=("$status")
            import_oids+=("$tree_oid")
            case "$RUN_MODE" in
              generative)
                relative="${path#research/generative/}"
                if [ "$path" = "research/generative/index.json" ] && [ "$status" = "M" ]; then
                  gen_index=$((gen_index + 1))
                elif [ "$relative" != "$path" ] && [[ "$relative" != */* ]] \
                  && [ "$status" = "A" ] && [[ "$relative" = *.html ]]; then
                  gen_html=$((gen_html + 1))
                elif [ "$relative" != "$path" ] && [[ "$relative" != */* ]] \
                  && [ "$status" = "A" ] && [[ "$relative" = *.ara.md ]]; then
                  gen_source=$((gen_source + 1))
                else
                  echo "::error::generative opencode commit changed forbidden path/status: $status $path"
                  path_violation=1
                fi
                ;;
              twitter)
                allowed=false
                while IFS= read -r allowed_path; do
                  if [ -n "$allowed_path" ] && [ "$path" = "$allowed_path" ]; then
                    allowed=true
                    break
                  fi
                done <<< "$ALLOWED_PATHS"
                if [ "$allowed" != "true" ] || [[ ! "$status" =~ ^[AM]$ ]]; then
                  echo "::error::twitter opencode commit changed forbidden path/status: $status $path"
                  path_violation=1
                fi
                ;;
              canary)
                echo "::error::canary opencode run created a commit: $status $path"
                path_violation=1
                ;;
            esac
          done < <("${trusted_git[@]}" diff --no-ext-diff --name-status --no-renames -z "$pre_sha..$post_sha")
          if [ "$RUN_MODE" = "generative" ] \
            && { [ "$gen_index" != "1" ] || [ "$gen_html" != "1" ] || [ "$gen_source" != "1" ] || [ "$changed_count" != "3" ]; }; then
            echo "::error::generative writer contract requires exactly index.json + one added HTML/ARA source pair."
            path_violation=1
          fi
          if [ "$path_violation" != "0" ]; then
            exit 1
          fi
        elif [ "$RUN_MODE" = "canary" ]; then
          echo "Canary left the disposable repository unchanged."
        fi

        # Methodology JSON and the Twitter tool log are untrusted DATA, not
        # executable workspace state. Reject links/oversized files and copy
        # only these named artifacts back to the real checkout.
        artifacts=()
        if [ "$RUN_MODE" = "generative" ]; then
          artifacts+=(.gen-verifier-findings.json .gen-redteam-findings.json .gen-claims-ledger.json)
        elif [ "$RUN_MODE" = "twitter" ] && [ -n "$BIRDY_TOOL_LOG_REL" ]; then
          artifacts+=("${BIRDY_TOOL_LOG_REL#/}")
        fi
        # Both GNU and BSD realpath require the target to exist; avoid GNU's
        # non-portable -e spelling because local/self-hosted runners include macOS.
        isolated_root=$(realpath -- "$isolated_workspace")
        trusted_workspace=$(realpath -- "$GITHUB_WORKSPACE")
        for artifact in ${artifacts[@]+"${artifacts[@]}"}; do
          case "$artifact" in
            ""|/*|.|..|./*|../*|*/../*|*/..|*/./*|*/.)
              echo "::error::opencode artifact path is not a clean relative path: $artifact"
              exit 1
              ;;
          esac
          source_artifact="$isolated_workspace/$artifact"
          if [ -e "$source_artifact" ] || [ -L "$source_artifact" ]; then
            if [ ! -f "$source_artifact" ] || [ -L "$source_artifact" ]; then
              echo "::error::opencode artifact is not a regular file: $artifact"
              exit 1
            fi
            source_resolved=$(realpath -- "$source_artifact")
            if [ "$source_resolved" != "$isolated_root/$artifact" ]; then
              echo "::error::opencode artifact escapes the isolated workspace or crosses a symlink: $artifact"
              exit 1
            fi
            if [ "$(wc -c < "$source_artifact")" -gt 10485760 ]; then
              echo "::error::opencode artifact exceeds 10 MiB: $artifact"
              exit 1
            fi
            artifact_parent=$(dirname -- "$artifact")
            if [ "$artifact_parent" = "." ]; then
              expected_destination_parent="$trusted_workspace"
            else
              expected_destination_parent="$trusted_workspace/$artifact_parent"
            fi
            if [ ! -d "$expected_destination_parent" ] \
              || [ -L "$expected_destination_parent" ]; then
              echo "::error::opencode artifact destination parent is missing, linked, or not a directory: $artifact"
              exit 1
            fi
            destination_parent_resolved=$(realpath -- "$expected_destination_parent")
            if [ "$destination_parent_resolved" != "$expected_destination_parent" ]; then
              echo "::error::opencode artifact destination crosses a symlink: $artifact"
              exit 1
            fi
            destination="$trusted_workspace/$artifact"
            if [ -L "$destination" ] || { [ -e "$destination" ] && [ ! -f "$destination" ]; }; then
              echo "::error::opencode artifact destination is not a regular file path: $artifact"
              exit 1
            fi
          fi
        done

        if [ "$post_sha" != "$pre_sha" ]; then
          if [ "$("${trusted_git[@]}" rev-parse HEAD)" != "$pre_sha" ]; then
            echo "::error::Real checkout HEAD changed during isolated opencode run."
            exit 1
          fi

          # Never ask Git to populate the real worktree. Even with global
          # attributes disabled, a persisted .git/info/attributes plus local
          # filter.*.smudge/process command can make checkout/reset execute
          # host code. Materialize only the already-validated regular blobs
          # with cat-file, update the index without -u, then advance HEAD with
          # an old-value compare-and-swap.
          import_dir="$build_dir/trusted-import"
          rm -rf -- "$import_dir"
          mkdir -p "$import_dir"

          install_blob() {
            local source_blob="$1"
            local destination_blob="$2"
            local destination_dir staged_blob
            destination_dir=$(dirname -- "$destination_blob")
            staged_blob=$(mktemp "$destination_dir/.opencode-import.XXXXXX") || return 1
            if ! install -m 644 "$source_blob" "$staged_blob"; then
              rm -f -- "$staged_blob"
              return 1
            fi
            if ! mv -f -- "$staged_blob" "$destination_blob"; then
              rm -f -- "$staged_blob"
              return 1
            fi
          }

          import_count=${#import_paths[@]}
          for ((import_i = 0; import_i < import_count; import_i++)); do
            path=${import_paths[$import_i]}
            status=${import_statuses[$import_i]}
            tree_oid=${import_oids[$import_i]}
            destination="$trusted_workspace/$path"
            destination_parent=$(dirname -- "$destination")
            if [ ! -d "$destination_parent" ] || [ -L "$destination_parent" ] \
              || [ "$(realpath -- "$destination_parent")" != "$destination_parent" ]; then
              echo "::error::opencode commit destination crosses a linked or missing directory: $path"
              exit 1
            fi
            if [ "$status" = "A" ]; then
              import_pre_oids[$import_i]=""
              if [ -e "$destination" ] || [ -L "$destination" ]; then
                echo "::error::opencode added path would overwrite real checkout data: $path"
                exit 1
              fi
            elif [ "$status" = "M" ]; then
              if [ ! -f "$destination" ] || [ -L "$destination" ] \
                || [ "$(realpath -- "$destination")" != "$destination" ]; then
                echo "::error::opencode modified path is not a canonical regular checkout file: $path"
                exit 1
              fi
              pre_entry=$("${trusted_git[@]}" ls-tree "$pre_sha" -- "$path")
              pre_header="${pre_entry%%$'\t'*}"
              read -r pre_mode pre_type pre_oid <<< "$pre_header"
              if [ "$pre_mode" != "100644" ] || [ "$pre_type" != "blob" ]; then
                echo "::error::opencode modified path cannot be restored as a regular blob: $path"
                exit 1
              fi
              import_pre_oids[$import_i]="$pre_oid"
              "${trusted_git[@]}" cat-file blob "$pre_sha:$path" \
                > "$import_dir/$import_i.pre"
            else
              echo "::error::opencode import received an unvalidated status: $status $path"
              exit 1
            fi
            "${trusted_git[@]}" cat-file blob "$tree_oid" \
              > "$import_dir/$import_i.post"
          done

          restore_pre_import() {
            local restore_i restore_path restore_status restore_destination
            local restore_failed=0
            "${trusted_git[@]}" read-tree --reset --no-sparse-checkout "$pre_sha" \
              || restore_failed=1
            for ((restore_i = 0; restore_i < import_count; restore_i++)); do
              restore_path=${import_paths[$restore_i]}
              restore_status=${import_statuses[$restore_i]}
              restore_destination="$trusted_workspace/$restore_path"
              if [ "$restore_status" = "A" ]; then
                rm -f -- "$restore_destination" || restore_failed=1
              elif ! install_blob "$import_dir/$restore_i.pre" "$restore_destination"; then
                restore_failed=1
              fi
            done
            if [ "$("${trusted_git[@]}" rev-parse HEAD)" != "$pre_sha" ] \
              || [ "$("${trusted_git[@]}" write-tree)" \
                != "$("${trusted_git[@]}" rev-parse "$pre_sha^{tree}")" ]; then
              restore_failed=1
            fi
            for ((restore_i = 0; restore_i < import_count; restore_i++)); do
              restore_destination="$trusted_workspace/${import_paths[$restore_i]}"
              if [ "${import_statuses[$restore_i]}" = "A" ]; then
                if [ -e "$restore_destination" ] || [ -L "$restore_destination" ]; then
                  restore_failed=1
                fi
              elif [ "$("${trusted_git[@]}" hash-object --no-filters -- \
                "$restore_destination")" != "${import_pre_oids[$restore_i]}" ]; then
                restore_failed=1
              fi
            done
            return "$restore_failed"
          }

          apply_failed=0
          for ((import_i = 0; import_i < import_count; import_i++)); do
            destination="$trusted_workspace/${import_paths[$import_i]}"
            if ! install_blob "$import_dir/$import_i.post" "$destination"; then
              apply_failed=1
              break
            fi
          done
          if [ "$apply_failed" != "0" ] \
            || ! "${trusted_git[@]}" read-tree --reset --no-sparse-checkout "$post_sha" \
            || ! "${trusted_git[@]}" update-ref HEAD "$post_sha" "$pre_sha"; then
            restore_pre_import \
              || echo "::error::Failed to fully restore the pre-import checkout."
            echo "::error::Failed to atomically import the validated opencode commit."
            exit 1
          fi

          expected_tree=$("${trusted_git[@]}" rev-parse "$post_sha^{tree}")
          actual_tree=$("${trusted_git[@]}" write-tree)
          import_verified=true
          if [ "$actual_tree" != "$expected_tree" ] \
            || [ "$("${trusted_git[@]}" rev-parse HEAD)" != "$post_sha" ]; then
            import_verified=false
          fi
          for ((import_i = 0; import_i < import_count; import_i++)); do
            destination="$trusted_workspace/${import_paths[$import_i]}"
            if [ "$("${trusted_git[@]}" hash-object --no-filters -- "$destination")" \
              != "${import_oids[$import_i]}" ]; then
              import_verified=false
            fi
          done
          if [ "$import_verified" != "true" ]; then
            rollback_failed=0
            "${trusted_git[@]}" update-ref HEAD "$pre_sha" "$post_sha" \
              || rollback_failed=1
            restore_pre_import || rollback_failed=1
            if [ "$rollback_failed" != "0" ]; then
              echo "::error::Failed to fully restore the pre-import checkout."
            fi
            echo "::error::Validated opencode commit did not materialize exactly."
            exit 1
          fi
        fi
        for artifact in ${artifacts[@]+"${artifacts[@]}"}; do
          source_artifact="$isolated_workspace/$artifact"
          if [ -f "$source_artifact" ] && [ ! -L "$source_artifact" ]; then
            source_resolved=$(realpath -- "$source_artifact")
            if [ "$source_resolved" != "$isolated_root/$artifact" ]; then
              echo "::error::opencode artifact source changed after validation: $artifact"
              exit 1
            fi
            destination="$trusted_workspace/$artifact"
            install -m 600 "$source_resolved" "$destination"
          fi
        done

        # TRUSTED_IMPORT_GUARD_END
        exit "$agent_status"
