name: Run opencode in container
description: >-
  Run the opencode agent inside a Docker container with only the workflow
  workspace, the rendered prompt, and (optionally) the Twitter snapshot
  mounted.

# WHY THIS EXISTS
#
# opencode was the one agent harness in this repo with no containment. Claude
# lanes get the bubblewrap sandbox from the checked-in .claude/settings.json
# (failIfUnavailable: true, allowUnsandboxedCommands: false, denyRead on ~/,
# /proc, ~/.ssh, ~/.aws, and env denies on every provider token). pi lanes get
# .github/actions/run-pi-container. opencode read NEITHER: it ran bare on the
# self-hosted host with `permission: {edit,bash,webfetch}: allow` plus `--auto`,
# which auto-approves anything not explicitly denied.
#
# That mattered because generative-research.yml triggers on `issues: [opened,
# labeled]` and its twitter_url path feeds live tweets, replies and images to
# the agent. Attacker-influenced text reaching an agent that holds unsandboxed
# host bash on a runner with a PERSISTENT home — where other lanes' credentials
# live — is a prompt-injection blast radius, not a theoretical one. The prior
# containment was prose in the prompt ("do not exfiltrate env") plus Actions log
# masking; neither is enforcement.
#
# This mirrors run-pi-container: same --cap-drop ALL, --security-opt
# no-new-privileges, --pids-limit, non-root --user matching the host uid so
# writes into the mounted workspace keep correct ownership, and a container
# HOME under /tmp so the agent never sees the runner's real home.
#
# Missing Docker is a HARD FAILURE. Never fall back to host-level `opencode
# run` — that is exactly the posture this action removes.

inputs:
  prompt-file:
    description: >-
      Path to the rendered prompt file (host path). Exactly one of
      prompt-file / prompt-text is required; that is enforced at runtime rather
      than by `required: true`, which cannot express either/or.
    required: false
    default: ''
  model:
    description: Fully-qualified opencode model ref, e.g. opencode-go/deepseek-v4-flash.
    required: true
  opencode-api-key:
    description: OPENCODE_API_KEY (OpenCode Go subscription).
    required: true
  opencode-config:
    description: Workspace-relative path to the opencode config to inject.
    required: false
    default: .github/opencode/opencode.json
  timeout-minutes:
    description: Hard wall-clock cap on the agent turn, enforced inside the container.
    required: false
    default: '45'
  mount-bird-snapshot:
    description: >-
      Mount /tmp/bird read-only. The Twitter lanes read a pre-fetched snapshot
      from there; generative-research does not.
    required: false
    default: 'false'
  bird-auth-token:
    description: X/Twitter auth_token cookie, for birdy calls made by the agent.
    required: false
    default: ''
  bird-ct0:
    description: X/Twitter ct0 cookie, for birdy calls made by the agent.
    required: false
    default: ''
  birdy-tool-log-path:
    description: Workspace-relative path for birdy's tool log, if the lane collects one.
    required: false
    default: ''
  gen-slug:
    description: GEN_SLUG for the generative-research lane.
    required: false
    default: ''
  gen-source:
    description: GEN_SOURCE for the generative-research lane.
    required: false
    default: ''
  gen-draft:
    description: >-
      GEN_DRAFT for the generative-research lane. Only the BASENAME is used:
      the host path lives under $RUNNER_TEMP, which the non-root container user
      cannot even mkdir (`/home/<runner>/... Permission denied`), and mounting
      $RUNNER_TEMP would hand the agent every other job's leftovers on a
      persistent runner. The draft is written and read entirely within one
      agent turn — the writer persists the .ara.md into research/generative/
      on success — so it is remapped to a container-local path instead.
    required: false
    default: ''
  git-user-name:
    description: >-
      Commit identity for writers that commit from inside the container
      (generative-research's write_generative_research.py does). Passed as
      GIT_AUTHOR_*/GIT_COMMITTER_* rather than written to config, because the
      container HOME is throwaway and the mounted .git/config is shared state.
    required: false
    default: github-actions[bot]
  git-user-email:
    description: Commit identity email (see git-user-name).
    required: false
    default: 41898282+github-actions[bot]@users.noreply.github.com
  prompt-text:
    description: >-
      Inline prompt, used instead of prompt-file. For short probes (the canary)
      that have no rendered file. Exactly one of prompt-file / prompt-text.
    required: false
    default: ''
  output-file:
    description: >-
      Host path to tee the agent's stdout to, for lanes that assert on what the
      agent said (the canary greps for its token). Written on the host, so it
      needs no mount and the container cannot tamper with it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build and run opencode container
      shell: bash
      env:
        PROMPT_FILE: ${{ inputs.prompt-file }}
        PROMPT_TEXT: ${{ inputs.prompt-text }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        OPENCODE_MODEL_REF: ${{ inputs.model }}
        OPENCODE_API_KEY: ${{ inputs.opencode-api-key }}
        OPENCODE_CONFIG_REL: ${{ inputs.opencode-config }}
        AGENT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        MOUNT_BIRD_SNAPSHOT: ${{ inputs.mount-bird-snapshot }}
        AUTH_TOKEN: ${{ inputs.bird-auth-token }}
        CT0: ${{ inputs.bird-ct0 }}
        BIRDY_TOOL_LOG_REL: ${{ inputs.birdy-tool-log-path }}
        GEN_SLUG: ${{ inputs.gen-slug }}
        GEN_SOURCE: ${{ inputs.gen-source }}
        GEN_DRAFT: ${{ inputs.gen-draft }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -euo pipefail

        if ! command -v docker >/dev/null 2>&1; then
          echo "::error::Docker is required for sandboxed opencode runs. Refusing to fall back to host-level 'opencode run' — that is the unsandboxed posture this action exists to remove."
          exit 1
        fi
        if [ -n "$PROMPT_FILE" ] && [ -n "$PROMPT_TEXT" ]; then
          echo "::error::Pass exactly one of prompt-file / prompt-text, not both."
          exit 1
        fi
        if [ -z "$PROMPT_FILE" ] && [ -z "$PROMPT_TEXT" ]; then
          echo "::error::One of prompt-file / prompt-text is required."
          exit 1
        fi
        if [ -n "$PROMPT_FILE" ] && [ ! -f "$PROMPT_FILE" ]; then
          echo "::error::opencode prompt file not found: $PROMPT_FILE"
          exit 1
        fi
        # An inline prompt is staged to a run-scoped file so both paths mount
        # the prompt identically read-only.
        if [ -n "$PROMPT_TEXT" ]; then
          PROMPT_FILE="${RUNNER_TEMP:-/tmp}/opencode-inline-prompt-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}.md"
          printf '%s' "$PROMPT_TEXT" > "$PROMPT_FILE"
        fi
        if [ ! -f "$GITHUB_WORKSPACE/$OPENCODE_CONFIG_REL" ]; then
          echo "::error::opencode config not found: $OPENCODE_CONFIG_REL"
          exit 1
        fi
        if [ "$MOUNT_BIRD_SNAPSHOT" = "true" ] && [ ! -d /tmp/bird ]; then
          echo "::error::Twitter fetch directory /tmp/bird is missing."
          exit 1
        fi

        build_dir="${RUNNER_TEMP:-/tmp}/opencode-container-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        rm -rf "$build_dir"
        mkdir -p "$build_dir"

        # Everything the two opencode lanes shell out to:
        #   generative-research -> uv run python (17 call sites), birdy, pdftotext, git, curl, jq
        #   hourly-twitter      -> birdy, jq
        # One image serves both; pinned so a rebuild months from now is the
        # same image, unlike the runner-side installer which tracks latest.
        cat > "$build_dir/Dockerfile" <<'EOF'
        FROM node:22-bookworm-slim
        RUN apt-get update \
          && apt-get install -y --no-install-recommends \
               ca-certificates curl git jq poppler-utils \
          && rm -rf /var/lib/apt/lists/*
        # --ignore-scripts stays on so no TRANSITIVE dependency gets to run
        # arbitrary install code, but opencode-ai genuinely needs its own
        # postinstall (it fetches the platform binary) and hard-fails without
        # it: "opencode-ai's postinstall script was not run." So run exactly
        # that one script, explicitly, instead of dropping the flag globally.
        RUN npm install -g --ignore-scripts opencode-ai@1.18.3 \
          && ( cd "$(npm root -g)/opencode-ai" && node postinstall.mjs )
        # birdy: single static Go binary since v1.0.0, no Node runtime.
        RUN set -eux; \
          arch="$(dpkg --print-architecture)"; \
          case "$arch" in amd64) a=amd64 ;; arm64) a=arm64 ;; *) echo "unsupported arch $arch" >&2; exit 1 ;; esac; \
          curl -fsSL "https://github.com/guzus/birdy/releases/download/v1.1.0/birdy_linux_${a}.tar.gz" -o /tmp/birdy.tgz; \
          tar -xzf /tmp/birdy.tgz -C /tmp; \
          install -m 755 /tmp/birdy /usr/local/bin/birdy; \
          rm -rf /tmp/birdy.tgz /tmp/birdy
        # uv drives every `uv run python scripts/...` the research prompt makes.
        COPY --from=ghcr.io/astral-sh/uv:0.9.7 /uv /uvx /usr/local/bin/
        RUN birdy version && uv --version && opencode --version
        WORKDIR /workspace
        EOF

        image="ara-opencode-agent:${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        docker build --pull -t "$image" "$build_dir"

        # Optional mounts / env, assembled as arrays so empty values never
        # collapse into a stray argument.
        # Remap the draft into the container (see the gen-draft input docs).
        GEN_DRAFT_IN_CONTAINER=""
        if [ -n "$GEN_DRAFT" ]; then
          GEN_DRAFT_IN_CONTAINER="/tmp/opencode-home/$(basename "$GEN_DRAFT")"
        fi

        # Expanded below as ${extra_args[@]+"${extra_args[@]}"}: under `set -u`
        # a plain "${arr[@]}" on an EMPTY array is an unbound-variable error in
        # bash < 4.4. The Linux runner has 5.x so it would pass there and blow
        # up anywhere older — not worth the latent trap.
        extra_args=()
        if [ "$MOUNT_BIRD_SNAPSHOT" = "true" ]; then
          extra_args+=(--volume "/tmp/bird:/tmp/bird:ro")
        fi
        if [ -n "$BIRDY_TOOL_LOG_REL" ]; then
          extra_args+=(--env "BIRDY_TOOL_LOG_PATH=/workspace/${BIRDY_TOOL_LOG_REL#/}")
        fi

        # The agent's HOME is a throwaway inside the container: the runner's
        # real home holds other lanes' credentials and must never be reachable.
        # UV_* keep uv's python + cache inside the container too, so a package
        # download can't write to shared runner state.
        docker_cmd=(docker run --rm \
          --user "$(id -u):$(id -g)" \
          --workdir /workspace \
          --cap-drop ALL \
          --security-opt no-new-privileges \
          --pids-limit 512 \
          --env HOME=/tmp/opencode-home \
          --env XDG_CONFIG_HOME=/tmp/opencode-home/.config \
          --env XDG_DATA_HOME=/tmp/opencode-home/.local/share \
          --env XDG_CACHE_HOME=/tmp/opencode-home/.cache \
          --env UV_CACHE_DIR=/tmp/opencode-home/.cache/uv \
          --env UV_PYTHON_INSTALL_DIR=/tmp/opencode-home/.local/uv-python \
          --env UV_LINK_MODE=copy \
          --env OPENCODE_API_KEY \
          --env OPENCODE_DISABLE_AUTOUPDATE=1 \
          --env "OPENCODE_CONFIG=/workspace/${OPENCODE_CONFIG_REL#/}" \
          --env AUTH_TOKEN \
          --env CT0 \
          --env BIRDY_READ_ONLY=1 \
          --env GEN_SLUG \
          --env GEN_SOURCE \
          --env "GEN_DRAFT=$GEN_DRAFT_IN_CONTAINER" \
          --env "GIT_AUTHOR_NAME=$GIT_USER_NAME" \
          --env "GIT_AUTHOR_EMAIL=$GIT_USER_EMAIL" \
          --env "GIT_COMMITTER_NAME=$GIT_USER_NAME" \
          --env "GIT_COMMITTER_EMAIL=$GIT_USER_EMAIL" \
          --env OPENCODE_MODEL_REF \
          --env AGENT_TIMEOUT_MINUTES \
          ${extra_args[@]+"${extra_args[@]}"} \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --volume "$PROMPT_FILE:/tmp/opencode-prompt.md:ro" \
          "$image" \
          bash -lc 'mkdir -p "$HOME" "$XDG_CONFIG_HOME" \
            && timeout "${AGENT_TIMEOUT_MINUTES}m" opencode run \
                 -m "$OPENCODE_MODEL_REF" \
                 --auto \
                 "$(cat /tmp/opencode-prompt.md)"')

        # tee on the HOST, so the output file needs no mount and the container
        # cannot rewrite what the lane asserts on.
        if [ -n "$OUTPUT_FILE" ]; then
          "${docker_cmd[@]}" | tee "$OUTPUT_FILE"
        else
          "${docker_cmd[@]}"
        fi
